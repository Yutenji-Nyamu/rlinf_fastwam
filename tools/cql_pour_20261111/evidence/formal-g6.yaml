    model_type: rlt_mlp_policy
    precision: fp32
    z_dim: 2048
    proprio_dim: 14
    action_dim: 14
    num_action_chunks: 10
    ref_num_action_chunks: 10
    add_value_head: false
    add_q_head: true
    q_head_type: default
    fixed_std: 0.002
    is_lora: false
    lora_rank: 32
    output_activation: identity
  optim:
    clip_grad: 10.0
    lr: 0.0001
