env:
  train:
    env_type: robotwin
    total_num_envs: 32
    auto_reset: false
    ignore_terminations: false
    reward_coef: 1.0
    use_custom_reward: true
    use_rel_reward: false
    center_crop: false
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: false
    max_steps_per_rollout_epoch: 200
    max_episode_steps: 200
    is_eval: false
    assets_path: ${oc.env:RUN_PATH_1}
    seeds_path: ${oc.env:RUN_PATH_2}
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ${oc.env:RUN_PATH_3}
    enable_offload: true
    task_config:
      task_name: turn_switch
      step_lim: 200
      planner_backend: mplib
      render_freq: 0
      episode_num: 100
      use_seed: false
      save_freq: 15
      embodiment:
      - aloha-agilex
      language_num: 100
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      camera:
        head_camera_type: D435
        wrist_camera_type: D435
        collect_head_camera: true
        collect_wrist_camera: true
      data_type:
        rgb: true
        third_view: false
        depth: false
        pointcloud: false
        observer: false
        endpose: false
        qpos: true
        mesh_segmentation: false
        actor_segmentation: false
      pcd_down_sample_num: 1024
      pcd_crop: true
      save_path: ${oc.env:RUN_PATH_4}
      clear_cache_freq: 1
      collect_data: true
      eval_video_log: false
    rollout_epoch: 1
    process_offload: true
  eval:
    env_type: robotwin
    total_num_envs: 32
    auto_reset: true
    ignore_terminations: true
    reward_coef: 1.0
    use_custom_reward: true
    use_rel_reward: false
    center_crop: false
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: false
    max_steps_per_rollout_epoch: 200
    max_episode_steps: 200
    is_eval: true
    assets_path: ${oc.env:RUN_PATH_1}
    seeds_path: ${oc.env:RUN_PATH_5}
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ${oc.env:RUN_PATH_6}
    enable_offload: true
    task_config:
      task_name: turn_switch
      step_lim: 200
      planner_backend: mplib
      render_freq: 0
      episode_num: 100
      use_seed: false
      save_freq: 15
      embodiment:
      - aloha-agilex
      language_num: 100
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      camera:
        head_camera_type: D435
        wrist_camera_type: D435
        collect_head_camera: true
        collect_wrist_camera: true
      data_type:
        rgb: true
        third_view: false
        depth: false
        pointcloud: false
        observer: false
        endpose: false
        qpos: true
        mesh_segmentation: false
        actor_segmentation: false
      pcd_down_sample_num: 1024
      pcd_crop: true
      save_path: ${oc.env:RUN_PATH_7}
      clear_cache_freq: 1
      collect_data: true
      eval_video_log: false
    rollout_epoch: 1
    process_offload: true
  group_name: EnvGroup
  enable_offload: true
actor:
  model:
    model_type: openpi
    model_path: ${oc.env:RUN_PATH_8}
    precision: null
    num_action_chunks: 20
    action_dim: 14
    is_lora: false
    lora_rank: 32
    use_proprio: true
    num_steps: 10
    add_value_head: false
    openpi:
      config_name: pi05_sidney_robotwin
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: 20
      num_steps: 10
      train_expert_only: true
      action_env_dim: 14
      noise_method: flow_ode
      add_value_head: false
      detach_critic_input: true
      use_dsrl: true
      dsrl_state_dim: 14
      dsrl_action_noise_dim: 1600
      dsrl_num_q_heads: 10
      dsrl_agg_q: mean
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims:
      - 128
      - 128
      - 128
      action_horizon: 50
      rtc_enabled: false
      dsrl_gaussian_warmup: true
      dsrl_eval_deterministic: false
      dsrl_u_enabled: false
      dsrl_u_spec: null
      dsrl_full_noise: true
      dsrl_fp32_small: true
      dsrl_noise_bound: 2.0
      dsrl_vectorized_q: true
      dsrl_compile_q: false
      dsrl_noise_groups: 50
      dsrl_compile_q_mode: reduce-overhead
      dsrl_noise_parameterization: gaussian_shift
      dsrl_shift_bound: 0.5
      dsrl_na_enabled: true
      dsrl_eval_gaussian_seed: 1611
      dsrl_shift_l2_bound: 4.0
      dsrl_vla_features: true
    add_q_head: true
    q_head_type: default
    openpi_data:
      repo_id: SidneyXie/pi05_robotwin
      norm_stats_path: ${oc.env:RUN_PATH_9}
      default_prompt: turn on the switch
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
    save_full_model_weights: false
    checkpoint_format: local_shard
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 128
  global_batch_size: 128
  seed: 1234
  enable_offload: false
  enable_drq: true
  compile_model: false
  optim:
    lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 3.5
    fused: true
  critic_optim:
    lr: 0.0003
    clip_grad: 10.0
    lr_scheduler: torch_constant
    fused: true
    adam_beta1: 0.9
    adam_beta2: 0.999
  defer_metrics: true
  foreach_target_update: false
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
    transport_device: cpu
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: '7'
  node_groups:
  - label: dsrl_gpu4
    node_ranks: '0'
    env_configs:
    - node_ranks: '0'
      python_interpreter_path: ${oc.env:RUN_PATH_10}
      env_vars:
      - EMBODIED_PATH: ${oc.env:RUN_PATH_11}
      - HOME: ${oc.env:RUN_PATH_12}
      - HYDRA_FULL_ERROR: '1'
      - JAX_PLATFORMS: cpu
      - LD_PRELOAD: ${oc.env:RUN_PATH_13}
      - MUJOCO_GL: egl
      - OMP_NUM_THREADS: '1'
      - OPENPI_DATA_HOME: ${oc.env:RUN_PATH_14}
      - PATH: ${oc.env:RUN_PATH_15}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin
      - PYOPENGL_PLATFORM: egl
      - PYTHONDONTWRITEBYTECODE: '1'
      - PYTHONPATH: ${oc.env:RUN_PATH_16}:${oc.env:RUN_PATH_17}:${oc.env:RUN_PATH_18}
      - PYTHONUNBUFFERED: '1'
      - RAY_ADDRESS: 172.17.0.1:6389
      - REPO_PATH: ${oc.env:RUN_PATH_17}
      - RLINF_CODE_WORKING_DIR: ${oc.env:RUN_PATH_17}
      - RLINF_OPENDW_GPU_SCOPE_MANIFEST: ${oc.env:RUN_PATH_19}
      - ROBOTWIN_ASSETS_PATH: ${oc.env:RUN_PATH_1}
      - ROBOTWIN_PATH: ${oc.env:RUN_PATH_18}
      - ROBOTWIN_PI0_BASE_PATH: ${oc.env:RUN_PATH_8}
      - ROBOTWIN_PI0_NORM_STATS_PATH: ${oc.env:RUN_PATH_9}
      - ROBOT_PLATFORM: ALOHA
      - TOKENIZERS_PARALLELISM: 'false'
      - __GL_APPLICATION_PROFILE: '1'
runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:RUN_PATH_20}
    project_name: rlinf
    experiment_name: formal
    logger_backends:
    - tensorboard
  max_epochs: 1000
  max_steps: 400
  only_eval: false
  val_check_interval: 4
  save_interval: 20
  resume_dir: null
  ckpt_path: null
  weight_sync_interval: 1
  overlap_env_bootstrap: false
  per_worker_log: false
  per_worker_log_path: null
algorithm:
  normalize_advantages: false
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  utd_ratio: 5
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  agg_q: mean
  actor_agg_q: mean
  backup_entropy: false
  critic_subsample_size: 0
  critic_actor_ratio: 2
  bootstrap_type: standard
  gamma: 0.999
  tau: 0.005
  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    target_entropy: -800.0
    optim:
      lr: 0.0003
      lr_scheduler: torch_constant
      clip_grad: 10.0
      fused: true
  replay_buffer:
    type: dsrl_transition
    schema_version: 5
    capacity: 25000
    warmup_size: 2000
    min_buffer_size: 1
    enable_preload: false
  target_update_freq: 1
  target_update_type: all
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  dsrl_u:
    enabled: false
    spec: null
    temperature: 2.5
    log_eps: 1.0e-12
    minmax_eps: 1.0e-06
  dsrl_critic_warmup_updates: 1000
  noise_prior_kl_weight: 0.5
  dsrl_cql_weight: 0.0
  dsrl_cql_temperature: 1.0
  dsrl_cql_noise_scale: 1.0
  dsrl_cql_include_policy: true
  dsrl_na:
    enabled: true
    blocks_per_round: 4
    action_q_steps: 15
    noise_q_steps: 5
    actor_steps: 5
    decode_batch_size: 16
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    model_type: openpi
    model_path: ${oc.env:RUN_PATH_8}
    precision: null
    num_action_chunks: 20
    action_dim: 14
    is_lora: false
    lora_rank: 32
    use_proprio: true
    num_steps: 10
    add_value_head: false
    openpi:
      config_name: pi05_sidney_robotwin
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: 20
      num_steps: 10
      train_expert_only: true
      action_env_dim: 14
      noise_method: flow_ode
      add_value_head: false
      detach_critic_input: true
      use_dsrl: true
      dsrl_state_dim: 14
      dsrl_action_noise_dim: 1600
      dsrl_num_q_heads: 10
      dsrl_agg_q: mean
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims:
      - 128
      - 128
      - 128
      action_horizon: 50
      rtc_enabled: false
      dsrl_gaussian_warmup: true
      dsrl_eval_deterministic: false
      dsrl_u_enabled: false
      dsrl_u_spec: null
      dsrl_full_noise: true
      dsrl_fp32_small: true
      dsrl_noise_bound: 2.0
      dsrl_vectorized_q: true
      dsrl_compile_q: false
      dsrl_noise_groups: 50
      dsrl_compile_q_mode: reduce-overhead
      dsrl_noise_parameterization: gaussian_shift
      dsrl_shift_bound: 0.5
      dsrl_na_enabled: true
      dsrl_eval_gaussian_seed: 1611
      dsrl_shift_l2_bound: 4.0
      dsrl_vla_features: true
    add_q_head: true
    q_head_type: default
    openpi_data:
      repo_id: SidneyXie/pi05_robotwin
      norm_stats_path: ${oc.env:RUN_PATH_9}
      default_prompt: turn on the switch
reward:
  use_reward_model: false
critic:
  use_critic_model: false
