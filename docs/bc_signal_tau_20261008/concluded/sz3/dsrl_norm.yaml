env:
  train:
    env_type: robotwin
    total_num_envs: 8
    auto_reset: false
    ignore_terminations: false
    reward_coef: 1.0
    use_custom_reward: true
    use_rel_reward: false
    center_crop: false
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: false
    max_steps_per_rollout_epoch: 200
    max_episode_steps: 200
    is_eval: false
    assets_path: /data/chenyiteng/projects/rlinf-shenzhen/RoboTwin-RLinf-support
    seeds_path: /data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/dsrl/rlinf/envs/robotwin/seeds/train_seeds.json
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: /data/chenyiteng/results/norm-bc-dsrl-20261007/norm-n8-w2000-fixed-formal200-1007-v1/video/train
    enable_offload: true
    task_config:
      task_name: adjust_bottle
      step_lim: 200
      planner_backend: mplib
      render_freq: 0
      episode_num: 100
      use_seed: false
      save_freq: 15
      embodiment:
      - aloha-agilex
      language_num: 100
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      camera:
        head_camera_type: D435
        wrist_camera_type: D435
        collect_head_camera: true
        collect_wrist_camera: true
      data_type:
        rgb: true
        third_view: false
        depth: false
        pointcloud: false
        observer: false
        endpose: false
        qpos: true
        mesh_segmentation: false
        actor_segmentation: false
      pcd_down_sample_num: 1024
      pcd_crop: true
      save_path: /data/chenyiteng/results/norm-bc-dsrl-20261007/norm-n8-w2000-fixed-formal200-1007-v1/robotwin_data/train
      clear_cache_freq: 1
      collect_data: true
      eval_video_log: true
    rollout_epoch: 1
  eval:
    env_type: robotwin
    total_num_envs: 4
    auto_reset: true
    ignore_terminations: true
    reward_coef: 1.0
    use_custom_reward: true
    use_rel_reward: false
    center_crop: false
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: false
    max_steps_per_rollout_epoch: 200
    max_episode_steps: 200
    is_eval: true
    assets_path: /data/chenyiteng/projects/rlinf-shenzhen/RoboTwin-RLinf-support
    seeds_path: /data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/dsrl/rlinf/envs/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: /data/chenyiteng/results/norm-bc-dsrl-20261007/norm-n8-w2000-fixed-formal200-1007-v1/video/eval
    enable_offload: false
    task_config:
      task_name: adjust_bottle
      step_lim: 200
      planner_backend: mplib
      render_freq: 0
      episode_num: 100
      use_seed: false
      save_freq: 15
      embodiment:
      - aloha-agilex
      language_num: 100
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      camera:
        head_camera_type: D435
        wrist_camera_type: D435
        collect_head_camera: true
        collect_wrist_camera: true
      data_type:
        rgb: true
        third_view: false
        depth: false
        pointcloud: false
        observer: false
        endpose: false
        qpos: true
        mesh_segmentation: false
        actor_segmentation: false
      pcd_down_sample_num: 1024
      pcd_crop: true
      save_path: /data/chenyiteng/results/norm-bc-dsrl-20261007/norm-n8-w2000-fixed-formal200-1007-v1/robotwin_data/eval
      clear_cache_freq: 1
      collect_data: true
      eval_video_log: true
    rollout_epoch: 3
  group_name: EnvGroup
  enable_offload: true
actor:
  model:
    model_type: openpi
    model_path: /data/chenyiteng/models/rlinf-native/sidney-pi05-robotwin-e49e2ab
    precision: null
    num_action_chunks: 20
    action_dim: 14
    is_lora: false
    lora_rank: 32
    use_proprio: true
    num_steps: 10
    add_value_head: false
    openpi:
      config_name: pi05_sidney_robotwin
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: 20
      num_steps: 10
      train_expert_only: true
      action_env_dim: 14
      noise_method: flow_ode
      add_value_head: false
      detach_critic_input: true
      use_dsrl: true
      dsrl_state_dim: 14
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_agg_q: mean
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims:
      - 128
      - 128
      - 128
      action_horizon: 50
      rtc_enabled: false
      dsrl_gaussian_warmup: true
      dsrl_eval_deterministic: false
      dsrl_u_enabled: true
      dsrl_u_spec:
        name: norm_residual_t5_l3
        schema_version: 1
        main_steps: 10
        action_dim: 14
        action_horizon: 50
        chunk_length: 20
        tail_steps: 5
        deep_layers: 3
        readout: post_residual_pre_final_norm
        reduction: mean_of_l2
        mask: submitted_prefix
        compute_dtype: float32
        noise: cast_behavior_latent
        extra_solver_steps: 0
    add_q_head: true
    q_head_type: default
    openpi_data:
      repo_id: SidneyXie/pi05_robotwin
      norm_stats_path: /data/chenyiteng/models/rlinf-native/sidney-pi05-robotwin-e49e2ab/physical-intelligence/robotwin/norm_stats.json
      default_prompt: adjust the bottle
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
    save_full_model_weights: false
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: false
  enable_drq: true
  compile_model: false
  optim:
    lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-08
    clip_grad: 3.5
  critic_optim:
    lr: 0.0003
    clip_grad: 10.0
    lr_scheduler: torch_constant
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
    transport_device: cpu
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout:
      node_group: norm_dsrl_g7
      placement: '7'
  node_groups:
  - label: norm_dsrl_g7
    node_ranks: '0'
    env_configs:
    - node_ranks: '0'
      python_interpreter_path: /home/chenyiteng/venvs/rlinf-7d07-openpi-robotwin/bin/python
      env_vars:
      - ASSETS_PATH: /data/chenyiteng/projects/rlinf-shenzhen/RoboTwin-RLinf-support
      - CUDA_HOME: /home/chenyiteng/tools/cuda-12.9
      - EMBODIED_PATH: /data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/dsrl/examples/embodiment
      - HOME: /home/chenyiteng
      - HYDRA_FULL_ERROR: '1'
      - JAX_PLATFORMS: cpu
      - LD_LIBRARY_PATH: /home/chenyiteng/tools/cuda-12.9/lib64
      - LD_PRELOAD: /data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/control/scope-g7/libnorm_g7_20261007.so
      - MUJOCO_GL: egl
      - NO_PROXY: 127.0.0.1,localhost,h100-gpu01
      - OMP_NUM_THREADS: '1'
      - OPENPI_DATA_HOME: /home/chenyiteng/.cache/openpi
      - PATH: /home/chenyiteng/venvs/rlinf-7d07-openpi-robotwin/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin
      - PI05_MODEL_PATH: /data/chenyiteng/models/rlinf-native/sidney-pi05-robotwin-e49e2ab
      - PYOPENGL_PLATFORM: egl
      - PYTHONDONTWRITEBYTECODE: '1'
      - PYTHONPATH: /data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/control/scope-g7/bootstrap:/data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/dsrl:/data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/robotwin-bc
      - PYTHONUNBUFFERED: '1'
      - RAY_ADDRESS: 127.0.0.1:26379
      - REPO_PATH: /data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/dsrl
      - RLINF_CODE_WORKING_DIR: /data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/dsrl
      - RLINF_OPENDW_GPU_SCOPE_MANIFEST: /data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/control/scope-g7/scope.json
      - ROBOTWIN_ASSETS_PATH: /data/chenyiteng/projects/rlinf-shenzhen/RoboTwin-RLinf-support
      - ROBOTWIN_PATH: /data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/robotwin-bc
      - ROBOTWIN_PI0_BASE_PATH: /data/chenyiteng/models/rlinf-native/sidney-pi05-robotwin-e49e2ab
      - ROBOTWIN_PI0_NORM_STATS_PATH: /data/chenyiteng/models/rlinf-native/sidney-pi05-robotwin-e49e2ab/physical-intelligence/robotwin/norm_stats.json
      - ROBOT_PLATFORM: ALOHA
      - TMPDIR: /data/chenyiteng/tmp
      - TOKENIZERS_PARALLELISM: 'false'
      - VIRTUAL_ENV: /home/chenyiteng/venvs/rlinf-7d07-openpi-robotwin
      - VK_DRIVER_FILES: /usr/share/vulkan/icd.d/nvidia_icd.json
      - VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/nvidia_icd.json
      - __GL_APPLICATION_PROFILE: '1'
      - no_proxy: 127.0.0.1,localhost,h100-gpu01
runner:
  task_type: embodied
  logger:
    log_path: /data/chenyiteng/results/norm-bc-dsrl-20261007/norm-n8-w2000-fixed-formal200-1007-v1
    project_name: rlinf
    experiment_name: norm-n8-w2000-fixed-formal200-1007-v1
    logger_backends:
    - tensorboard
  max_epochs: 1000
  max_steps: 200
  only_eval: false
  val_check_interval: 13
  save_interval: 65
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: false
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  utd_ratio: 20
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  agg_q: mean
  actor_agg_q: mean
  backup_entropy: false
  critic_subsample_size: 0
  critic_actor_ratio: 1
  bootstrap_type: standard
  gamma: 0.999
  tau: 0.005
  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 1.0
    target_entropy: -16
    optim:
      lr: 0.0003
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    type: dsrl_transition
    schema_version: 2
    capacity: 25000
    warmup_size: 2000
    min_buffer_size: 1
    enable_preload: false
  target_update_freq: 1
  target_update_type: all
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  dsrl_u:
    enabled: true
    spec:
      name: norm_residual_t5_l3
      schema_version: 1
      main_steps: 10
      action_dim: 14
      action_horizon: 50
      chunk_length: 20
      tail_steps: 5
      deep_layers: 3
      readout: post_residual_pre_final_norm
      reduction: mean_of_l2
      mask: submitted_prefix
      compute_dtype: float32
      noise: cast_behavior_latent
      extra_solver_steps: 0
    temperature: 2.5
    log_eps: 1.0e-12
    minmax_eps: 1.0e-06
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    model_path: /data/chenyiteng/models/rlinf-native/sidney-pi05-robotwin-e49e2ab
    precision: null
reward:
  use_reward_model: false
critic:
  use_critic_model: false
