# RLT-Q tau and controls: configuration overlay (both off when omitted).
# Apply to either existing U or Norm config; retain its signal and signal_spec.
algorithm:
  rlt_q_weighting:
    temperature: 2.5
    alpha: 1.0
    chunk_dropout:
      enabled: true
      probability: 0.2
      seed: 42
    alpha_schedule:
      enabled: true
      local:
        enabled: false
      chunk:
        enabled: true
        start_step: 1
        end_step: 500
        end_alpha: 0.0
