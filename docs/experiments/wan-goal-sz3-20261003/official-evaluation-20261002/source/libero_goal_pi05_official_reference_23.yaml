# @package _global_
# Official native Pi0Eval, dual-camera C5/M5 Goal reference; 20 x 25 batching.
# Inference only; each checkpoint uses the identical 500 fixed initial states.
defaults:
  - env/libero_goal@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: '2-3'

runner:
  task_type: embodied_eval
  logger:
    log_path: ${oc.env:WM_EVAL_RUN_DIR}
    project_name: rlinf
    experiment_name: libero_goal_pi05_official_reference_23
    logger_backends: [tensorboard]
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: EnvGroup
  eval:
    rollout_epoch: 25
    total_num_envs: 20
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 320
    max_steps_per_rollout_epoch: 320
    group_size: 1
    use_fixed_reset_state_ids: true
    is_eval: true
    seed: 0
    video_cfg:
      save_video: true
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:WAN_GOAL_PI05_PATH}
    model_type: openpi
    precision: null
    num_action_chunks: 5
    num_steps: 5
    action_dim: 7
    add_value_head: false
    openpi:
      # Native official evaluation policy class.
      task: eval
      config_name: pi05_libero
      noise_level: 0.3
      action_horizon: 10
      action_chunk: 5
      discrete_state_input: false
    openpi_data:
      wrist_mode: required
      extra_delta_transform: false
      norm_stats_path: ${oc.env:WAN_GOAL_PI05_PATH}/physical-intelligence/libero/norm_stats.json

reward:
  use_reward_model: false
critic:
  use_critic_model: false
