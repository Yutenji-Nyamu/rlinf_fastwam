actor:
  model:
    model_type: openpi
    model_path: /root/autodl-tmp/models/rlinf/RLinf-Pi0-RoboTwin-SFT-adjust_bottle
    precision: null
    num_action_chunks: 10
    action_dim: 14
    is_lora: false
    lora_rank: 32
    use_proprio: true
    num_steps: 4
    add_value_head: false
    openpi:
      config_name: pi0_aloha_robotwin
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: 10
      num_steps: 4
      train_expert_only: false
      action_env_dim: 14
      noise_method: flow_ode
      add_value_head: false
      detach_critic_input: true
      action_horizon: 50
      use_rlt: true
      rlt_train_vla: false
      rlt_alpha: 0.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_num_rl_tokens: 1
      rlt_prefix_seq_len: 768
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_image_only: true
      rlt_use_mask: true
      rlt_action_adapter: robotwin_aloha_canonical_v1
    openpi_data:
      repo_id: physical-intelligence/robotwin
      default_prompt: adjust the bottle
      norm_stats_path: /root/autodl-tmp/models/rlinf/RLinf-Pi0-RoboTwin-SFT-adjust_bottle/physical-intelligence/robotwin/norm_stats.json
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 16
  global_batch_size: 32
  seed: 0
  optim:
    lr: 2.5e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 2000
    lr_warmup_steps: 100
    lr_scheduler: cosine
    num_cycles: 0.5
    min_lr: 2.5e-06
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-1
runner:
  task_type: sft
  logger:
    log_path: /root/autodl-tmp/RLinf_rlt_pi0_robotwin_logs
    project_name: rlinf-rlt
    experiment_name: robotwin_adjust_bottle_rlt_stage1_sft_openpi
    logger_backends:
    - tensorboard
  max_epochs: -1
  max_steps: 2000
  val_check_interval: -1
  save_interval: 2000
data:
  train_data_paths:
  - dataset_path: /root/autodl-tmp/datasets/robotwin_adjust_bottle_clean50_lerobot
    weight: 1.0
reward:
  use_reward_model: false
critic:
  use_critic_model: false
