env:
  train:
    env_type: robodojo
    total_num_envs: 8
    auto_reset: false
    ignore_terminations: false
    reward_coef: 1.0
    use_custom_reward: true
    use_rel_reward: false
    center_crop: false
    seed: 42
    group_size: 1
    use_fixed_reset_state_ids: false
    max_steps_per_rollout_epoch: 700
    max_episode_steps: 700
    is_eval: false
    video_cfg:
      save_video: false
    enable_offload: false
    task_config:
      task_name: put_bottles_into_dustbin
    rollout_epoch: 1
    physical_gpus:
    - 4
    rpc_dir: /data/chenyiteng/deployment-20261104/dojo-dsrl-u-g4/rpc
    rpc_timeout: 900
    reset_timeout: 1200
  eval:
    env_type: robodojo
    total_num_envs: 8
    auto_reset: false
    ignore_terminations: false
    reward_coef: 1.0
    use_custom_reward: true
    use_rel_reward: false
    center_crop: false
    seed: 42
    group_size: 1
    use_fixed_reset_state_ids: true
    max_steps_per_rollout_epoch: 700
    max_episode_steps: 700
    is_eval: true
    video_cfg:
      save_video: false
    enable_offload: false
    task_config:
      task_name: put_bottles_into_dustbin
    rollout_epoch: 4
    physical_gpus:
    - 4
    rpc_dir: /data/chenyiteng/deployment-20261104/dojo-dsrl-u-g4/rpc
    rpc_timeout: 900
    reset_timeout: 1200
    fixed_layout_cycle: 32
  group_name: EnvGroup
  enable_offload: false
actor:
  model:
    model_type: openpi
    model_path: /data/chenyiteng/models/rlinf-native/dojo-pi05-arx-x5-seed1-59999-pytorch
    precision: null
    num_action_chunks: 50
    action_dim: 14
    is_lora: false
    lora_rank: 32
    use_proprio: true
    num_steps: 10
    add_value_head: false
    openpi:
      config_name: pi05_robodojo
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: 50
      num_steps: 10
      train_expert_only: true
      action_env_dim: 14
      noise_method: flow_ode
      add_value_head: false
      detach_critic_input: true
      use_dsrl: true
      dsrl_state_dim: 14
      dsrl_action_noise_dim: 1600
      dsrl_num_q_heads: 10
      dsrl_agg_q: mean
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims:
      - 128
      - 128
      - 128
      action_horizon: 50
      rtc_enabled: false
      dsrl_gaussian_warmup: true
      dsrl_eval_deterministic: false
      dsrl_full_noise: true
      dsrl_u_enabled: true
      dsrl_u_spec:
        name: ugrow_ode10_vs5
        schema_version: 1
        main_steps: 10
        side_steps: 5
        action_dim: 14
        action_horizon: 50
        chunk_length: 50
        epsilon: 1.0e-08
        action_space: model
        coordinate_reduction: mean_population_std_over_rms
        mask: submitted_prefix
        compute_dtype: float32
        noise: same_full_cast_behavior_latent
    add_q_head: true
    q_head_type: default
    openpi_data:
      norm_stats_path: /data/chenyiteng/models/rlinf-native/dojo-pi05-arx-x5-seed1-59999-pytorch/assets/arx_x5_sim/norm_stats.json
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
    save_full_model_weights: false
    checkpoint_format: local_shard
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: false
  enable_drq: true
  compile_model: false
  optim:
    lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-08
    clip_grad: 3.5
  critic_optim:
    lr: 0.0003
    clip_grad: 10.0
    lr_scheduler: torch_constant
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
    transport_device: cpu
cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: '4'
runner:
  task_type: embodied
  logger:
    log_path: /data/chenyiteng/results/dojo-offpolicy/dojo-dsrl-u-g4-20261104/formal
    project_name: rlinf
    experiment_name: formal
    logger_backends:
    - tensorboard
  max_epochs: 1000
  max_steps: 100
  only_eval: false
  val_check_interval: 12
  save_interval: 4
  resume_dir: null
  ckpt_path: null
  weight_sync_interval: 1
  overlap_env_bootstrap: false
  per_worker_log: false
  per_worker_log_path: null
algorithm:
  normalize_advantages: false
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  utd_ratio: 20
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  agg_q: mean
  actor_agg_q: mean
  backup_entropy: false
  critic_subsample_size: 0
  critic_actor_ratio: 1
  bootstrap_type: standard
  gamma: 0.999
  tau: 0.005
  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.02
    target_entropy: -800
    optim:
      lr: 0.0003
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    type: dsrl_transition
    schema_version: 4
    capacity: 25000
    warmup_size: 500
    min_buffer_size: 1
    enable_preload: false
  target_update_freq: 1
  target_update_type: all
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  dsrl_u:
    enabled: true
    spec:
      name: ugrow_ode10_vs5
      schema_version: 1
      main_steps: 10
      side_steps: 5
      action_dim: 14
      action_horizon: 50
      chunk_length: 50
      epsilon: 1.0e-08
      action_space: model
      coordinate_reduction: mean_population_std_over_rms
      mask: submitted_prefix
      compute_dtype: float32
      noise: same_full_cast_behavior_latent
    temperature: 2.5
    log_eps: 1.0e-12
    minmax_eps: 1.0e-06
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    model_type: openpi
    model_path: /data/chenyiteng/models/rlinf-native/dojo-pi05-arx-x5-seed1-59999-pytorch
    precision: null
    num_action_chunks: 50
    action_dim: 14
    is_lora: false
    lora_rank: 32
    use_proprio: true
    num_steps: 10
    add_value_head: false
    openpi:
      config_name: pi05_robodojo
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: 50
      num_steps: 10
      train_expert_only: true
      action_env_dim: 14
      noise_method: flow_ode
      add_value_head: false
      detach_critic_input: true
      use_dsrl: true
      dsrl_state_dim: 14
      dsrl_action_noise_dim: 1600
      dsrl_num_q_heads: 10
      dsrl_agg_q: mean
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims:
      - 128
      - 128
      - 128
      action_horizon: 50
      rtc_enabled: false
      dsrl_gaussian_warmup: true
      dsrl_eval_deterministic: false
      dsrl_full_noise: true
      dsrl_u_enabled: true
      dsrl_u_spec:
        name: ugrow_ode10_vs5
        schema_version: 1
        main_steps: 10
        side_steps: 5
        action_dim: 14
        action_horizon: 50
        chunk_length: 50
        epsilon: 1.0e-08
        action_space: model
        coordinate_reduction: mean_population_std_over_rms
        mask: submitted_prefix
        compute_dtype: float32
        noise: same_full_cast_behavior_latent
    add_q_head: true
    q_head_type: default
    openpi_data:
      norm_stats_path: /data/chenyiteng/models/rlinf-native/dojo-pi05-arx-x5-seed1-59999-pytorch/assets/arx_x5_sim/norm_stats.json
reward:
  use_reward_model: false
critic:
  use_critic_model: false
