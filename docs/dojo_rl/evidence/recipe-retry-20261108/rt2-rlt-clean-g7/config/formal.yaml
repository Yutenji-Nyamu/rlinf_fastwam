actor:
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: fp32
      reduce_dtype: fp32
      buffer_dtype: fp32
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 256
  global_batch_size: 512
  seed: 1234
  enable_offload: false
  model:
    model_type: rlt_mlp_policy
    precision: fp32
    z_dim: 2048
    proprio_dim: 14
    action_dim: 14
    num_action_chunks: 10
    ref_num_action_chunks: 10
    add_value_head: false
    add_q_head: true
    q_head_type: default
    fixed_std: 0.002
    is_lora: false
    lora_rank: 32
    output_activation: identity
  optim:
    clip_grad: 10.0
    lr: 0.0001
    lr_scheduler: torch_constant
    fused: false
  critic_optim:
    clip_grad: 10.0
    lr: 0.0001
    lr_scheduler: torch_constant
    fused: false
  defer_metrics: false
  foreach_target_update: false
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
