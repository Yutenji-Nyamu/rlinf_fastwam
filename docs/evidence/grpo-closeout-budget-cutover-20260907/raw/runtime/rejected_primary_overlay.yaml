# Method-only overlay on the successful Sidney pi0.5 GRPO implementation.
# Sampling/model/resource overrides are inherited from the Control launch.
defaults:
  - robotwin_move_stapler_pad_grpo_openpi_pi05_sidney
  - _self_

algorithm:
  logprob_type: action_level
  dvac_gradient_weighting:
    mode: apply
    application: action_advantage
    selected_l: 3
    warmup_steps: 1
    window_steps: 5
    weight_min: 0.5
    weight_max: 1.5
