env:
  train:
    env_type: robotwin
    total_num_envs: 2
    auto_reset: false
    ignore_terminations: false
    reward_coef: 1.0
    use_custom_reward: true
    use_rel_reward: true
    center_crop: false
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: false
    max_steps_per_rollout_epoch: 200
    max_episode_steps: 200
    is_eval: false
    assets_path: /root/autodl-tmp/RoboTwin_RLinf
    seeds_path: /root/autodl-tmp/RLinf_qam_pi0_robotwin/rlinf/envs/robotwin/seeds/train_seeds.json
    video_cfg:
      save_video: true
      info_on_video: true
      video_base_dir: /root/autodl-tmp/experiments/qam_pi0_robotwin/video/train
    enable_offload: false
    task_config:
      task_name: adjust_bottle
      step_lim: 200
      planner_backend: mplib
      render_freq: 0
      episode_num: 100
      use_seed: false
      save_freq: 15
      embodiment:
      - aloha-agilex
      language_num: 100
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      camera:
        head_camera_type: D435
        wrist_camera_type: D435
        collect_head_camera: true
        collect_wrist_camera: true
      data_type:
        rgb: true
        third_view: false
        depth: false
        pointcloud: false
        observer: false
        endpose: false
        qpos: true
        mesh_segmentation: false
        actor_segmentation: false
      pcd_down_sample_num: 1024
      pcd_crop: true
      save_path: ./data
      clear_cache_freq: 1
      collect_data: true
      eval_video_log: true
    rollout_epoch: 1
  eval:
    env_type: robotwin
    total_num_envs: 2
    auto_reset: true
    ignore_terminations: true
    reward_coef: 1.0
    use_custom_reward: true
    use_rel_reward: true
    center_crop: false
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: true
    max_steps_per_rollout_epoch: 200
    max_episode_steps: 200
    is_eval: true
    assets_path: /root/autodl-tmp/RoboTwin_RLinf
    seeds_path: /root/autodl-tmp/RLinf_qam_pi0_robotwin/rlinf/envs/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: /root/autodl-tmp/experiments/qam_pi0_robotwin/video/eval
    enable_offload: false
    task_config:
      task_name: adjust_bottle
      step_lim: 200
      planner_backend: mplib
      render_freq: 0
      episode_num: 100
      use_seed: false
      save_freq: 15
      embodiment:
      - aloha-agilex
      language_num: 100
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      camera:
        head_camera_type: D435
        wrist_camera_type: D435
        collect_head_camera: true
        collect_wrist_camera: true
      data_type:
        rgb: true
        third_view: false
        depth: false
        pointcloud: false
        observer: false
        endpose: false
        qpos: true
        mesh_segmentation: false
        actor_segmentation: false
      pcd_down_sample_num: 1024
      pcd_crop: true
      save_path: ./data
      clear_cache_freq: 1
      collect_data: true
      eval_video_log: true
    rollout_epoch: 1
  group_name: EnvGroup
  enable_offload: false
actor:
  model:
    model_type: openpi
    model_path: /root/autodl-tmp/models/rlinf/RLinf-Pi0-RoboTwin-SFT-adjust_bottle
    precision: null
    num_action_chunks: 20
    action_dim: 14
    is_lora: false
    lora_rank: 32
    use_proprio: true
    num_steps: 10
    add_value_head: false
    openpi:
      config_name: pi0_aloha_robotwin
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: 20
      num_steps: 10
      train_expert_only: true
      action_env_dim: 14
      noise_method: flow_ode
      add_value_head: false
      detach_critic_input: true
      use_dsrl: false
      dsrl_state_dim: 8
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_agg_q: mean
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims:
      - 128
      - 128
      - 128
      action_horizon: 50
      use_rlt: false
      use_qam: true
      qam_num_image_blocks: 3
      qam_projection_version: pi0-fixed-prefix-active-v1
    openpi_data:
      repo_id: physical-intelligence/robotwin
      default_prompt: adjust the bottle
      norm_stats_path: /root/autodl-tmp/models/rlinf/RLinf-Pi0-RoboTwin-SFT-adjust_bottle/physical-intelligence/robotwin/norm_stats.json
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 32
  global_batch_size: 64
  seed: 1234
  enable_offload: false
  optim:
    lr: 2.0e-05
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.0
    clip_grad: 1.0
    total_training_steps: 100000
    lr_warmup_steps: 0
    lr_scheduler: constant
    num_cycles: 0.5
    min_lr: 0.0
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: 0-1
runner:
  task_type: embodied
  use_training_pipeline: false
  overlap_env_bootstrap: false
  weight_sync_interval: 1
  logger:
    log_path: /root/autodl-tmp/experiments/qam_pi0_robotwin
    project_name: rlinf
    experiment_name: robotwin_adjust_bottle_qam_openpi_formal_v1
    logger_backends:
    - tensorboard
  max_epochs: 1000
  max_steps: 0
  only_eval: false
  val_check_interval: -1
  save_interval: 25
  resume_dir: null
  ckpt_path: null
algorithm:
  loss_type: embodied_qam
  adv_type: gae
  gamma: 0.99
  reward_coef: 1.0
  qam:
    phase: collect
    online_only: true
    task_prompt: adjust the bottle
    flow_steps: 10
    gamma_slot: 0.99
    rho: 0.5
    inv_temp: 0.0
    target_tau: 0.005
    num_q_heads: 10
    critic_hidden_dims:
    - 512
    - 512
    - 512
    - 512
    critic_lr: 0.0003
    critic_adam_beta1: 0.9
    critic_adam_beta2: 0.999
    critic_adam_eps: 1.0e-08
    critic_grad_clip: 1.0
    critic_init_seed: 2726
    replay_capacity: 4096
    min_replay_per_rank: 32
    warmup_global_inserts: 512
    q_only_updates_before_am: 512
    utd_ratio: 1.0
    max_updates_per_step: 32
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    model_path: /root/autodl-tmp/models/rlinf/RLinf-Pi0-RoboTwin-SFT-adjust_bottle
    precision: null
reward:
  use_reward_model: false
critic:
  use_critic_model: false
