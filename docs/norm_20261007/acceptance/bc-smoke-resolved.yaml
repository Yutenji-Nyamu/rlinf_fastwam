env:
  train:
    env_type: robotwin
    total_num_envs: 8
    auto_reset: false
    ignore_terminations: false
    reward_coef: 1.0
    use_custom_reward: true
    use_rel_reward: true
    center_crop: false
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: false
    max_steps_per_rollout_epoch: 200
    max_episode_steps: 200
    is_eval: false
    assets_path: /data/chenyiteng/projects/rlinf-shenzhen/RoboTwin-RLinf-support
    seeds_path: /data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/bc/rlinf/envs/robotwin/seeds/train_seeds.json
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: /data/chenyiteng/results/norm-bc-dsrl-20261007/bc-smoke300-v1/video/train
    enable_offload: false
    task_config:
      task_name: move_pillbottle_pad
      step_lim: 200
      planner_backend: mplib
      render_freq: 0
      episode_num: 100
      use_seed: false
      save_freq: 15
      embodiment:
      - aloha-agilex
      language_num: 100
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      camera:
        head_camera_type: D435
        wrist_camera_type: D435
        collect_head_camera: true
        collect_wrist_camera: true
      data_type:
        rgb: true
        third_view: false
        depth: false
        pointcloud: false
        observer: false
        endpose: false
        qpos: true
        mesh_segmentation: false
        actor_segmentation: false
      pcd_down_sample_num: 1024
      pcd_crop: true
      save_path: /data/chenyiteng/results/norm-bc-dsrl-20261007/bc-smoke300-v1/robotwin_data
      clear_cache_freq: 1
      collect_data: true
      eval_video_log: true
    rollout_epoch: 1
  eval:
    env_type: robotwin
    total_num_envs: 8
    auto_reset: false
    ignore_terminations: true
    reward_coef: 1.0
    use_custom_reward: true
    use_rel_reward: true
    center_crop: false
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: true
    max_steps_per_rollout_epoch: 200
    max_episode_steps: 200
    is_eval: true
    assets_path: /data/chenyiteng/projects/rlinf-shenzhen/RoboTwin-RLinf-support
    seeds_path: /data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/bc/rlinf/envs/robotwin/seeds/eval_sidney_fixed32.json
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: /data/chenyiteng/results/norm-bc-dsrl-20261007/bc-smoke300-v1/video/train
    enable_offload: false
    task_config:
      task_name: move_pillbottle_pad
      step_lim: 200
      planner_backend: mplib
      render_freq: 0
      episode_num: 100
      use_seed: false
      save_freq: 15
      embodiment:
      - aloha-agilex
      language_num: 100
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      camera:
        head_camera_type: D435
        wrist_camera_type: D435
        collect_head_camera: true
        collect_wrist_camera: true
      data_type:
        rgb: true
        third_view: false
        depth: false
        pointcloud: false
        observer: false
        endpose: false
        qpos: true
        mesh_segmentation: false
        actor_segmentation: false
      pcd_down_sample_num: 1024
      pcd_crop: true
      save_path: /data/chenyiteng/results/norm-bc-dsrl-20261007/bc-smoke300-v1/robotwin_data
      clear_cache_freq: 1
      collect_data: true
      eval_video_log: true
    rollout_epoch: 4
    fixed_reset_batch_count: 4
  group_name: EnvGroup
  min_open_files: 4096
actor:
  model:
    model_type: openpi
    model_path: /data/chenyiteng/models/rlinf-native/sidney-pi05-robotwin-e49e2ab
    precision: null
    num_action_chunks: 50
    action_dim: 14
    is_lora: false
    lora_rank: 32
    use_proprio: true
    num_steps: 10
    add_value_head: false
    openpi:
      config_name: pi05_sidney_robotwin
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: 50
      num_steps: 10
      train_expert_only: true
      action_env_dim: 14
      noise_method: flow_sde
      add_value_head: false
      detach_critic_input: false
      use_dsrl: false
      dsrl_state_dim: 8
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_agg_q: mean
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims:
      - 128
      - 128
      - 128
      image_augmentation: false
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
    checkpoint_format: local_shard
    wrap_policy:
      transformer_layer_cls_to_wrap:
      - GemmaMLP
      - SiglipVisionEmbeddings
      - GemmaRMSNorm
      - GemmaRotaryEmbedding
      no_split_names:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - action_in_proj
      - action_out_proj
      - lm_head
      - state_proj
      - action_time_mlp_in
      - action_time_mlp_out
      - time_mlp_in
      - time_mlp_out
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 32
  global_batch_size: 1024
  seed: 1234
  enable_offload: true
  enable_drq: false
  optim:
    lr: 2.5e-05
    value_lr: 2.5e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 1000
    lr_warmup_steps: 0
    lr_scheduler: constant
    min_lr: 2.5e-05
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout:
      node_group: norm_bc_g6
      placement: '6'
  tracer:
    enable: false
  node_groups:
  - label: norm_bc_g6
    node_ranks: '0'
    env_configs:
    - node_ranks: '0'
      python_interpreter_path: /home/chenyiteng/venvs/rlinf-7d07-openpi-robotwin/bin/python
      env_vars:
      - ASSETS_PATH: /data/chenyiteng/projects/rlinf-shenzhen/RoboTwin-RLinf-support
      - CUDA_HOME: /home/chenyiteng/tools/cuda-12.9
      - EMBODIED_PATH: /data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/bc/examples/embodiment
      - HYDRA_FULL_ERROR: '1'
      - JAX_PLATFORMS: cpu
      - LD_LIBRARY_PATH: /home/chenyiteng/tools/cuda-12.9/lib64
      - LD_PRELOAD: /data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/control/scope-g6/libnorm_g6_20261007.so
      - MUJOCO_GL: egl
      - NO_PROXY: 127.0.0.1,localhost,h100-gpu01
      - OMP_NUM_THREADS: '1'
      - ONLINE_BC_RUN_DIR: /data/chenyiteng/results/norm-bc-dsrl-20261007/bc-smoke300-v1
      - OPENPI_DATA_HOME: /home/chenyiteng/.cache/openpi
      - PATH: /home/chenyiteng/venvs/rlinf-7d07-openpi-robotwin/bin:/home/chenyiteng/tools/cuda-12.9/bin:/home/chenyiteng/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - PI05_MODEL_PATH: /data/chenyiteng/models/rlinf-native/sidney-pi05-robotwin-e49e2ab
      - PYOPENGL_PLATFORM: egl
      - PYTHONDONTWRITEBYTECODE: '1'
      - PYTHONPATH: /data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/control/scope-g6/bootstrap:/data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/bc:/data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/robotwin-bc
      - PYTHONUNBUFFERED: '1'
      - RAY_ADDRESS: 127.0.0.1:26379
      - REPO_PATH: /data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/bc
      - RLINF_CODE_WORKING_DIR: /data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/bc
      - RLINF_OPENDW_GPU_SCOPE_MANIFEST: /data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/control/scope-g6/scope.json
      - ROBOTWIN_ASSETS_PATH: /data/chenyiteng/projects/rlinf-shenzhen/RoboTwin-RLinf-support
      - ROBOTWIN_PATH: /data/chenyiteng/projects/norm-bc-dsrl-sz3-20261007/robotwin-bc
      - ROBOT_PLATFORM: ALOHA
      - TMPDIR: /data/chenyiteng/tmp
      - TOKENIZERS_PARALLELISM: 'false'
      - VIRTUAL_ENV: /home/chenyiteng/venvs/rlinf-7d07-openpi-robotwin
      - VK_DRIVER_FILES: /usr/share/vulkan/icd.d/nvidia_icd.json
      - VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/nvidia_icd.json
      - __GL_APPLICATION_PROFILE: '1'
      - no_proxy: 127.0.0.1,localhost,h100-gpu01
runner:
  task_type: embodied
  logger:
    log_path: /data/chenyiteng/results/norm-bc-dsrl-20261007/bc-smoke300-v1
    project_name: rlinf-online-bc
    experiment_name: bc-smoke300-v1
    logger_backends:
    - tensorboard
  max_epochs: 2
  max_steps: 2
  only_eval: false
  val_check_interval: 0
  save_interval: 2
  resume_dir: null
  ckpt_path: null
  overlap_env_bootstrap: false
  per_worker_log: false
  per_worker_log_path: null
  weight_sync_interval: 1
algorithm:
  loss_type: online_bc
  adv_type: gae
  gamma: 0.99
  reward_coef: 1.0
  update_epoch: 5
  online_bc:
    data_path: /data/chenyiteng/results/norm-bc-dsrl-20261007/bc-smoke300-v1/success_data
    demo_weight: 0.0
    demo_data_path: null
    max_success_chunks: 3
    dvac:
      enabled: true
      tail_steps: 0
      window: 5
      alpha: 0.25
      z_clip: 2.0
      log_eps: 1.0e-12
      std_floor: 1.0e-06
      mapping: bounded_linear
      weight_min: 0.0
      weight_max: 5.0
      signal_kind: norm_residual_t5_l3
      signal_spec:
        version: 1
        kind: ugrow_10_5
        steps:
        - 10
        - 5
        solver: flow_ode
        coordinate_space: normalized
        action_dim: 14
        epsilon: 1.0e-08
  replay_buffer:
    min_buffer_size: 1
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  collect_prev_infos: false
  collect_final_values: false
  expert_model: null
  model:
    model_path: /data/chenyiteng/models/rlinf-native/sidney-pi05-robotwin-e49e2ab
    precision: null
  seed: 42
reward:
  use_reward_model: false
critic:
  use_critic_model: false
