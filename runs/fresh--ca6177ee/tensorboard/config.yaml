      save_video: false
      info_on_video: true
      video_base_dir: /data/chenyiteng/results/rlinf-rlt/smoke-stage2-current-ar-fresh1-resume1-20260823/fresh/video/eval
    enable_offload: false
    task_config:
      task_name: adjust_bottle
      step_lim: 200
      planner_backend: mplib
      render_freq: 0
      episode_num: 100
      use_seed: false
      save_freq: 15
      embodiment:
      - aloha-agilex
      language_num: 100
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      camera:
        head_camera_type: D435
        wrist_camera_type: D435
        collect_head_camera: true
        collect_wrist_camera: true
      data_type:
        rgb: true
        third_view: false
        depth: false
        pointcloud: false
        observer: false
        endpose: false
        qpos: true
        mesh_segmentation: false
        actor_segmentation: false
      pcd_down_sample_num: 1024
      pcd_crop: true
      save_path: ./data
      clear_cache_freq: 1
      collect_data: true
      eval_video_log: true
    rollout_epoch: 1
  group_name: EnvGroup
  enable_offload: true
actor:
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: fp32
      reduce_dtype: fp32
      buffer_dtype: fp32
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 128
  global_batch_size: 512
  seed: 1234
  enable_offload: false
  model:
    model_type: rlt_mlp_policy
    precision: fp32
    z_dim: 2048
    proprio_dim: 14
    action_dim: 14
    num_action_chunks: 10
    ref_num_action_chunks: 10
    add_value_head: false
    add_q_head: true
    q_head_type: default
    fixed_std: 0.002
    is_lora: false
    lora_rank: 32
  optim:
    clip_grad: 10.0
    lr: 0.0001
    lr_scheduler: torch_constant
  critic_optim:
    clip_grad: 10.0
    lr: 0.0001
    lr_scheduler: torch_constant
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 4-5
  tracer:
    enable: false
runner:
  task_type: embodied
  logger:
    log_path: /data/chenyiteng/results/rlinf-rlt/smoke-stage2-current-ar-fresh1-resume1-20260823/fresh
    project_name: rlinf-rlt
    experiment_name: robotwin_adjust_bottle_rlt_stage2_current_ar_smoke_fresh1_v1
    logger_backends:
    - tensorboard
  max_epochs: 1000
  max_steps: 1
  only_eval: false
  weight_sync_interval: 1
  val_check_interval: 1
  save_interval: 1
  resume_dir: null
  ckpt_path: null
  per_worker_log: false
  per_worker_log_path: null
  overlap_env_bootstrap: false
algorithm:
  update_epoch: 5
  group_size: 1
  adv_type: embodied_sac
  loss_type: rlt_ac
  loss_agg_func: token-mean
  agg_q: min
  actor_agg_q: q1
  enable_drq: false
  q_head_type: default
  bootstrap_type: standard
  gamma: 0.99
  tau: 0.005
  rlt_route:
    type: full_task
  rlt_transition_replay:
    enable: true
    compact: true
    bootstrap_on_truncation: true
  rlt_schedule:
    enable: true
    max_updates_per_train_step: 20
    warmup_min_size: 2
    warmup_post_collect_updates: 8
    train_every_episodes: 0
    train_every_transitions: 1
  q_weight: 1.0
  bc_weight: 1.0
  reference_dropout_prob: 0.5
  actor_weight_schedule:
    enable: true
    warmup_updates: 4
    ramp_updates: 8
    warmup_bc_weight: 7.0
    warmup_q_weight: 0.05
    online_bc_weight: 2.5
    online_q_weight: 0.45
  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 0.0003
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: true
    cache_size: 15000
    sample_window_size: 15000
    min_buffer_size: 1
    auto_save: false
  target_update_freq: 1
  target_update_type: all
  critic_actor_ratio: 2
  critic_subsample_size: 0
  backup_entropy: false
  rlt_resume:
    enable: true
    schema_version: 1
    contract:
      current_base_commit: 7d07a4212ee6858cc333e1d4fab7a37256d1f839
      model_identity: exact_pi0
      reconstruction: current_causal_ar
      stage1_manifest_path: /data/chenyiteng/results/rlinf-rlt/smoke-stage1-current-ar-2step-20260823/artifacts/stage1_artifact_manifest.json
      stage1_manifest_id: sz-rlt-stage1-current-ar-smoke2-v1
      stage1_manifest_sha256: ac513e5dfddc5d72a7bd325f47baeb99f83d569e04f27b18972ad5f05a282090
      norm_stats_sha256: 649ed92b431bd70627febdb00b2385e35fcab5088e72a4e4a4845585f8ce4f6a
      train_vla: false
      prefix_seq_len: 768
      image_only: true
      use_mask: true
      z_dim: 2048
      action_horizon: 50
      action_chunk: 10
      action_dim: 14
      canonical_adapter_version: robotwin_aloha_canonical_v1
      route: full_task
      replay: compact_transition
      bootstrap: pure_truncation_only
rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    model_type: rlt_mlp_policy
    model_path: null
    precision: fp32
    action_dim: 14
    num_action_chunks: 10
    ref_num_action_chunks: 10
    z_dim: 2048
    proprio_dim: 14
    add_q_head: true
    q_head_type: default
    fixed_std: 0.002
    is_lora: false
    lora_rank: 32
  rlt_feature_model:
    model_type: openpi
    model_path: /data/chenyiteng/results/rlinf-rlt/smoke-stage1-current-ar-2step-20260823/robotwin_adjust_bottle_rlt_stage1_current_ar_smoke2_v1/checkpoints/global_step_2
    precision: null
    num_action_chunks: 10
    action_dim: 14
    add_value_head: false
    is_lora: false
    lora_rank: 32
    openpi_data:
      repo_id: physical-intelligence/robotwin
      default_prompt: adjust the bottle
      norm_stats_path: /data/chenyiteng/models/rlinf/RLinf-Pi0-RoboTwin-SFT-adjust_bottle@92684e50/physical-intelligence/robotwin/norm_stats.json
    openpi:
      config_name: pi0_aloha_robotwin
      num_images_in_input: 3
      action_horizon: 50
      action_chunk: 10
      action_env_dim: 14
      num_steps: 4
      state_indices: []
      train_expert_only: false
      add_value_head: false
      detach_critic_input: true
      noise_method: flow_ode
      rtc_enabled: false
      use_rlt: true
      rlt_train_vla: false
      rlt_alpha: 0.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 768
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_image_only: true
      rlt_use_mask: true
      rlt_action_adapter: robotwin_aloha_canonical_v1
  enable_torch_compile: false
