env:
  train:
    env_type: robotwin
    total_num_envs: 4
    auto_reset: false
    ignore_terminations: false
    reward_coef: 1.0
    use_custom_reward: true
    use_rel_reward: false
    center_crop: false
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: false
    max_steps_per_rollout_epoch: 200
    max_episode_steps: 200
    is_eval: false
    assets_path: /data/chenyiteng/projects/rlinf-shenzhen/RoboTwin-RLinf-support
    seeds_path: /data/chenyiteng/projects/rlinf-current-dsrl/RLinf-7d07-dsrl-robotwin/rlinf/envs/robotwin/seeds/train_seeds.json
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: /data/chenyiteng/results/rlinf-current-dsrl/formal-dsrl-pi0-robotwin-2gpu4env-200c-20260824-v1/run/video/train
    enable_offload: true
    task_config:
      task_name: adjust_bottle
      step_lim: 200
      planner_backend: mplib
      render_freq: 0
      episode_num: 100
      use_seed: false
      save_freq: 15
      embodiment:
      - aloha-agilex
      language_num: 100
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      camera:
        head_camera_type: D435
        wrist_camera_type: D435
        collect_head_camera: true
        collect_wrist_camera: true
      data_type:
        rgb: true
        third_view: false
        depth: false
        pointcloud: false
        observer: false
        endpose: false
        qpos: true
        mesh_segmentation: false
        actor_segmentation: false
      pcd_down_sample_num: 1024
      pcd_crop: true
      save_path: ./data
      clear_cache_freq: 1
      collect_data: true
      eval_video_log: true
    rollout_epoch: 1
  eval:
    env_type: robotwin
    total_num_envs: 4
    auto_reset: true
    ignore_terminations: true
    reward_coef: 1.0
    use_custom_reward: true
    use_rel_reward: false
    center_crop: false
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: false
    max_steps_per_rollout_epoch: 200
    max_episode_steps: 200
    is_eval: true
    assets_path: /data/chenyiteng/projects/rlinf-shenzhen/RoboTwin-RLinf-support
    seeds_path: /data/chenyiteng/projects/rlinf-current-dsrl/RLinf-7d07-dsrl-robotwin/rlinf/envs/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: /data/chenyiteng/results/rlinf-current-dsrl/formal-dsrl-pi0-robotwin-2gpu4env-200c-20260824-v1/run/video/eval
    enable_offload: false
    task_config:
      task_name: adjust_bottle
      step_lim: 200
      planner_backend: mplib
      render_freq: 0
      episode_num: 100
      use_seed: false
      save_freq: 15
      embodiment:
      - aloha-agilex
      language_num: 100
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      camera:
        head_camera_type: D435
        wrist_camera_type: D435
        collect_head_camera: true
        collect_wrist_camera: true
      data_type:
        rgb: true
        third_view: false
        depth: false
        pointcloud: false
        observer: false
        endpose: false
        qpos: true
        mesh_segmentation: false
        actor_segmentation: false
      pcd_down_sample_num: 1024
      pcd_crop: true
      save_path: ./data
      clear_cache_freq: 1
      collect_data: true
      eval_video_log: true
    rollout_epoch: 3
  group_name: EnvGroup
  enable_offload: true
actor:
  model:
    model_type: openpi
    model_path: /data/chenyiteng/models/rlinf/RLinf-Pi0-RoboTwin-SFT-adjust_bottle@92684e50
    precision: null
    num_action_chunks: 20
    action_dim: 14
    is_lora: false
    lora_rank: 32
    use_proprio: true
    num_steps: 4
    add_value_head: false
    openpi:
      config_name: pi0_aloha_robotwin
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: 20
      num_steps: 4
      train_expert_only: true
      action_env_dim: 14
      noise_method: flow_ode
      add_value_head: false
      detach_critic_input: true
      use_dsrl: true
      dsrl_state_dim: 14
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_agg_q: mean
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims:
      - 128
      - 128
      - 128
      action_horizon: 50
      rtc_enabled: false
      dsrl_gaussian_warmup: true
      dsrl_eval_deterministic: false
    add_q_head: true
    q_head_type: default
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
    save_full_model_weights: false
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 64
  global_batch_size: 256
  seed: 1234
  enable_offload: false
  enable_drq: true
  compile_model: false
  optim:
    lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-08
    clip_grad: 3.5
  critic_optim:
    lr: 0.0003
    clip_grad: 10.0
    lr_scheduler: torch_constant
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
    transport_device: cpu
cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: 6-7
  tracer:
    enable: false
runner:
  task_type: embodied
  logger:
    log_path: /data/chenyiteng/results/rlinf-current-dsrl/formal-dsrl-pi0-robotwin-2gpu4env-200c-20260824-v1/run
    project_name: rlinf
    experiment_name: dsrl-current-formal-200c-v1
    logger_backends:
    - tensorboard
  max_epochs: 1000
  max_steps: 200
  only_eval: false
  val_check_interval: 13
  save_interval: 65
  resume_dir: null
  ckpt_path: null
  per_worker_log: false
  per_worker_log_path: null
  weight_sync_interval: 1
  overlap_env_bootstrap: false
algorithm:
  normalize_advantages: false
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  utd_ratio: 20
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  agg_q: mean
  actor_agg_q: mean
  backup_entropy: false
  critic_subsample_size: 0
  critic_actor_ratio: 1
  bootstrap_type: standard
  gamma: 0.999
  tau: 0.005
  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 1.0
    target_entropy: -16
    optim:
      lr: 0.0003
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    type: dsrl_transition
    schema_version: 1
    capacity: 25000
    warmup_size: 500
    min_buffer_size: 1
    enable_preload: false
  target_update_freq: 1
  target_update_type: all
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    model_path: /data/chenyiteng/models/rlinf/RLinf-Pi0-RoboTwin-SFT-adjust_bottle@92684e50
    precision: null
reward:
  use_reward_model: false
critic:
  use_critic_model: false
