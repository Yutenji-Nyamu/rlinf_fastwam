# @package _global_
# Explicit action advantages; original chunk ratio/clip; no chunk weight normalization.
algorithm:
  logprob_type: chunk_level
  dvac_gradient_weighting:
    mode: apply
    application: chunk_clipped_action_advantage
    advantage_scope: positive
    selected_l: 3
    warmup_steps: 1
    window_steps: 5
    weight_min: 0.5
    weight_max: 1.5
