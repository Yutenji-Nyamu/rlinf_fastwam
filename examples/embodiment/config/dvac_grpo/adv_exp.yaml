# @package algorithm.dvac_gradient_weighting
# Same current-rollout DVAC domains; temperature controls allocation concentration.
mode: apply
application: chunk_clipped_action_advantage
normalization: two_level_group
scope: both
selected_l: 3
mapping: exp_mean
alpha_local: 1.0
alpha_chunk: 1.0
temperature_local: 0.5
temperature_chunk: 0.5
log_eps: 1.0e-12
minmax_eps: 1.0e-6
save_step_tensors: true
output_dir: ${runner.logger.log_path}/${runner.logger.experiment_name}/dvac_train
