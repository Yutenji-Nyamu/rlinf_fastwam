mode: apply
application: chunk_clipped_action_advantage
normalization: two_level_group
scope: positive
selected_l: 3
mapping: exp_mean
alpha_local: 1.0
alpha_chunk: 1.0
temperature_local: 1.5
temperature_chunk: 1.5
chunk_dropout:
  enabled: false
  probability: 0.2
  seed: 42
alpha_schedule:
  enabled: false
  local:
    enabled: false
    start_step: 1
    end_step: 200
    end_alpha: 0.0
  chunk:
    enabled: false
    start_step: 1
    end_step: 200
    end_alpha: 0.0
log_eps: 1.0e-12
minmax_eps: 1.0e-06
save_step_tensors: true
output_dir: ${runner.logger.log_path}/${runner.logger.experiment_name}/dvac_train
