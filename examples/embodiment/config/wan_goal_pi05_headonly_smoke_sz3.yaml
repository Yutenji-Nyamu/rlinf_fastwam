# @package _global_
# Standalone primary config copied from official pi05 Goal at d34d4c320d08cb982de034aa9a011f08dc0fa217.
# Only the documented Wan/head-only, physical 4-7, paths/offload and smoke budget differ.
# hydra.searchpath must stay in this primary config, not in an inherited full recipe.
defaults:
  - env/wan_libero_goal@env.train
  - env/libero_goal@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: '4-7'

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:WAN_GOAL_RUN_DIR}
    project_name: rlinf
    experiment_name: "wan_goal_pi05_headonly_smoke_sz3"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 2
  max_steps: 2

  only_eval: False
  val_check_interval: -1
  save_interval: 1

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 8
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: True
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: "EnvGroup"

  # Override the default values in env/libero_goal
  train:
    rollout_epoch: 1
    total_num_envs: 32
    group_size: ${algorithm.group_size}
    max_episode_steps: 320 # max episode steps for truncation
    max_steps_per_rollout_epoch: 320
    wan_wm_hf_ckpt_path: ${oc.env:WAN_GOAL_WM_PATH}
    reward_coef: ${algorithm.reward_coef}
    chunk: 8
    condition_frame_length: 5
    num_frames: 13
    num_inference_steps: 5
    enable_kir: true
    enable_offload: true
  eval:
    rollout_epoch: 1
    total_num_envs: 500
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 320
    max_steps_per_rollout_epoch: 320
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${oc.env:WAN_GOAL_PI05_PATH} # https://huggingface.co/RLinf/RLinf-Pi05-LIBERO-SFT
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 64
  global_batch_size: 1280 # 32 * 1 * (320 / 8); each of four ranks has 320 samples / 64 = 5 microbatches.
  seed: 42
  enable_offload: True

  # Override the default values in model/pi0_5
  model:
    model_path: ${oc.env:WAN_GOAL_PI05_PATH} # https://huggingface.co/RLinf/RLinf-Pi05-LIBERO-SFT
    num_action_chunks: 8
    model_type: "openpi"
    # openpi specific parameters
    openpi:
      task: rl
      noise_level: 0.3
      action_horizon: 10
      action_chunk: 8
      discrete_state_input: false
    openpi_data:
      wrist_mode: disabled
      extra_delta_transform: false
      norm_stats_path: ${oc.env:WAN_GOAL_PI05_PATH}/physical-intelligence/libero/norm_stats.json

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  # Override the default values in hybrid_engines/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
