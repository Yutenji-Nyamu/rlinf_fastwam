defaults:
  - env/robotwin_adjust_bottle@env.train
  - env/robotwin_adjust_bottle@env.eval
  - model/pi0@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: 0-1

runner:
  task_type: embodied
  logger:
    log_path: "/root/autodl-tmp/idea2_dvac_train_runs/idea2_dvac_r_only_downweight_smoke_2step_2gpu16env_20260821"
    project_name: rlinf
    experiment_name: "idea2_dvac_r_only_downweight_smoke_2step_2gpu16env_20260821"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: 2
  only_eval: False
  val_check_interval: -1
  save_interval: 10
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 2
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: True
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  dvac_gradient_weighting:
    mode: apply
    signal_mode: per_h_robust_residual
    l_values: [2, 3, 4]
    selected_l: 3
    warmup_steps: 1
    window_steps: 5
    stats_scope: per_h_recent_median_mad_all_queries
    log_eps: 1.0e-12
    scale_floor: 1.0e-6
    mad_consistency: 1.4826
    residual_clip: 2.0
    weight_mapping: asymmetric_linear
    weight_min: 0.5
    weight_max: 1.2
    output_dir: ${runner.logger.log_path}/dvac_train

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    enable_offload: True
    rollout_epoch: 8
    total_num_envs: 16
    reward_coef: ${algorithm.reward_coef}
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    group_size: ${algorithm.group_size}
    assets_path: "/root/autodl-tmp/idea2_dvac_train_wamppo/RoboTwin_RLinf"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/train_seeds.json
    center_crop: False
    task_config:
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      control_trace:
        enabled: true
        output_dir: ${runner.logger.log_path}/control_trace
        worker_indices: [0]
        env_slots: [0]
        max_episodes_per_slot: 1
        camera: head_camera
        fps: 10
        crf: 32
        output_width: 160
        output_height: 120
        max_frames_per_episode: 200
        max_frames_per_query: 50
    video_cfg:
      save_video: False
  eval:
    rollout_epoch: 16
    total_num_envs: 4
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 200
    reward_coef: ${algorithm.reward_coef}
    max_steps_per_rollout_epoch: 200
    group_size: 1
    use_fixed_reset_state_ids: False
    is_eval: True
    assets_path: "/root/autodl-tmp/idea2_dvac_train_wamppo/RoboTwin_RLinf"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    center_crop: False
    task_config:
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 512
  seed: 1234
  enable_offload: false
  model:
    model_path: "/root/autodl-tmp/models/rlinf/RLinf-Pi0-RoboTwin-SFT-adjust_bottle"
    num_action_chunks: 50
    add_value_head: False
    action_dim: 14
    openpi:
      config_name: "pi0_aloha_robotwin"
      num_images_in_input: 3
      detach_critic_input: False
  optim:
    lr: 5.6e-6
    value_lr: 1.1e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: False
    save_full_model_weights: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False

weight_syncer:
  patch:
    snapshot_device: cpu
    transport_device: cpu
    init_sync:
      enabled: true
