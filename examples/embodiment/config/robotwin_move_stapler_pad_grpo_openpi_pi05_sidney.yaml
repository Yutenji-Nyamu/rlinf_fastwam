# Engineering configuration for the converted SidneyXie/pi05_robotwin checkpoint.
# It composes the same maintained component configs as the official pi0.5 recipe.
defaults:
  - env/robotwin_adjust_bottle@env.train
  - env/robotwin_adjust_bottle@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: 0-7

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_move_stapler_pad_grpo_pi05_sidney"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  only_eval: false
  val_check_interval: 10
  save_interval: 10
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 8
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 5
  adv_type: grpo
  loss_type: actor
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: true
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  dvac_gradient_weighting:
    mode: "off"
    application: "logprob_st"
    selected_l: 3
    warmup_steps: 1
    window_steps: 5
    log_eps: 1.0e-12
    std_floor: 1.0e-6
    z_clip: 2.0
    strength: 0.5
    weight_min: null
    weight_max: null
    save_step_tensors: true
    output_dir: ${runner.logger.log_path}/${runner.logger.experiment_name}/dvac_train

env:
  group_name: EnvGroup
  enable_offload: true
  train:
    total_num_envs: 256
    rollout_epoch: 4
    max_episode_steps: 400
    max_steps_per_rollout_epoch: 400
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    assets_path: "/path/to/robotwin_assets"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/train_seeds.json
    center_crop: false
    task_config:
      task_name: move_stapler_pad
      step_lim: 400
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
  eval:
    rollout_epoch: 1
    total_num_envs: 128
    max_episode_steps: 400
    max_steps_per_rollout_epoch: 400
    reward_coef: ${algorithm.reward_coef}
    group_size: 1
    auto_reset: true
    ignore_terminations: true
    use_fixed_reset_state_ids: true
    is_eval: true
    assets_path: "/path/to/robotwin_assets"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_seeds.json
    center_crop: false
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
    task_config:
      task_name: move_stapler_pad
      step_lim: 400
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  global_batch_size: 2048
  micro_batch_size: 32
  seed: 1234
  enable_offload: true
  model:
    model_path: "/path/to/rlinf-native-sidney-pi05-robotwin"
    num_action_chunks: 50
    action_dim: 14
    num_steps: 10
    openpi:
      config_name: "pi05_sidney_robotwin"
      num_images_in_input: 3
      action_chunk: 50
      num_steps: 10
      noise_level: 0.3
      train_expert_only: True
      detach_critic_input: true
  optim:
    lr: 5.0e-06
    value_lr: 1.0e-04
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    checkpoint_format: local_shard

reward:
  use_reward_model: false

critic:
  use_critic_model: false
