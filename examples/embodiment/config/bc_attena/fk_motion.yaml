# @package _global_
# Motion-based AttenA adaptation, independent of all DVAC implementations.
algorithm:
  online_bc:
    attena:
      enabled: true
      geometry_path: ${oc.env:REPO_PATH}/examples/embodiment/config/bc_attena/aloha_geometry.json
      calibration_path: ${oc.env:REPO_PATH}/examples/embodiment/config/bc_attena/clean4u5_sum_calibration.json
      ell: 0.1
      epsilon: 1.0e-3
      clip_max: 2.0
      debug_batches: 0
