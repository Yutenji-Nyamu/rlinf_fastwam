# @package _global_
# Explicit opt-in. Inherit old BC 4/U5; U5 still means five Adam updates.
algorithm:
  online_bc:
    max_success_chunks: null
    dvac:
      enabled: true
      signal_kind: ugrow_10_5
      tail_steps: 0
      window: 5
      alpha: 0.25
      z_clip: 2.0
      log_eps: 1.0e-12
      std_floor: 1.0e-6
      mapping: bounded_linear
      weight_min: 0.0
      weight_max: 5.0
