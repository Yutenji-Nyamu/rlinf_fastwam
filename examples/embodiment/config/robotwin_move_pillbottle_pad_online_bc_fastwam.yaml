# Native Fast-WAM H32/C24 action-only online success BC.
# Method budget follows clean pi0.5 8/U10; micro2 is a memory setting.
defaults:
  - env/robotwin_adjust_bottle@env.train
  - env/robotwin_adjust_bottle@env.eval
  - model/fastwam_robotwin@actor.model
  - model/fastwam_robotwin@rollout.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/bucket_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: "6"

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:ONLINE_BC_RUN_DIR}
    project_name: rlinf-online-bc
    experiment_name: fastwam-pillbottle-online-bc8-u10
    logger_backends: [tensorboard]
  max_epochs: 100
  max_steps: -1
  only_eval: false
  val_check_interval: 5
  save_interval: 10
  weight_sync_interval: 1
  resume_dir: null
  ckpt_path: null
  overlap_env_bootstrap: false

algorithm:
  loss_type: online_bc
  adv_type: gae
  gamma: 0.99
  reward_coef: 1.0
  update_epoch: 10
  online_bc:
    data_path: ${runner.logger.log_path}/success_data
    demo_weight: 0.0
    demo_data_path: null
    max_success_chunks: null
  replay_buffer:
    min_buffer_size: 1

env:
  group_name: EnvGroup
  min_open_files: 4096
  enable_offload: true
  train:
    total_num_envs: 8
    rollout_epoch: 1
    auto_reset: false
    ignore_terminations: false
    max_episode_steps: 192
    max_steps_per_rollout_epoch: 192
    assets_path: ${oc.env:ASSETS_PATH}
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/train_seeds.json
    center_crop: false
    enable_offload: true
    video_cfg:
      save_video: false
    task_config:
      task_name: move_pillbottle_pad
      step_lim: 192
      save_path: ${runner.logger.log_path}/robotwin_data/train
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
  eval:
    total_num_envs: 8
    rollout_epoch: 4
    auto_reset: false
    ignore_terminations: true
    max_episode_steps: 192
    max_steps_per_rollout_epoch: 192
    use_fixed_reset_state_ids: true
    fixed_reset_batch_count: 4
    is_eval: true
    assets_path: ${oc.env:ASSETS_PATH}
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_sidney_fixed32.json
    center_crop: false
    enable_offload: true
    video_cfg:
      save_video: false
    task_config: ${env.train.task_config}

rollout:
  group_name: RolloutGroup
  backend: huggingface
  seed: 42
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  collect_prev_infos: false
  collect_final_values: false
  expert_model: null
  model:
    model_path: ${actor.model.model_path}
    checkpoint_path: ${actor.model.checkpoint_path}
    dataset_stats_path: ${actor.model.dataset_stats_path}
    precision: ${actor.model.precision}
    model_forward_batch_size: ${actor.model.model_forward_batch_size}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 1024
  seed: 1234
  enable_offload: true
  enable_drq: false
  model:
    model_forward_batch_size: 2
  optim:
    lr: 2.5e-5
    value_lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1e-8
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 1000
    lr_warmup_steps: 0
    lr_scheduler: constant
    min_lr: 2.5e-5
  fsdp_config:
    strategy: fsdp2
    sharding_strategy: full_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    wrap_policy:
      no_split_names: ["__none__"]
    save_full_model_weights: false
    checkpoint_format: dcp
    mixed_precision:
      cast_forward_inputs: false
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false

weight_syncer:
  type: bucket
  bucket:
    bucket_size: 536870912
    bucket_dtype: null
    bucket_device: cpu
    is_agent: false
    load_instant: true

reward:
  use_reward_model: false
critic:
  use_critic_model: false
