actor:
  model:
    model_type: fastwam
    model_path: /data/chenyiteng/models/fastwam/release-8eaceeb/robotwin_uncond_3cam_384.pt
    checkpoint_path: /data/chenyiteng/models/fastwam/release-8eaceeb/robotwin_uncond_3cam_384.pt
    dataset_stats_path: /data/chenyiteng/models/fastwam/release-8eaceeb/robotwin_uncond_3cam_384_dataset_stats.json
    precision: bf16
    is_lora: false
    action_dim: 14
    action_horizon: 32
    num_action_chunks: 24
    num_inference_steps: 10
    sigma_shift: 5.0
    text_cfg_scale: 1.0
    negative_prompt: ''
    rand_device: cpu
    tiled: false
    model_forward_batch_size: 2
    eval_seed: 0
    add_value_head: false
    rl:
      noise_level: 0.3
    fastwam:
      config_name: sim_robotwin
      task: robotwin_uncond_3cam_384_1e-4
  fsdp_config:
    strategy: fsdp2
    sharding_strategy: full_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
    wrap_policy:
      no_split_names:
      - __none__
    save_full_model_weights: false
    checkpoint_format: dcp
    cast_forward_inputs: false
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 256
  seed: 1234
  enable_offload: false
  optim:
    lr: 5.0e-06
    value_lr: 0.00011
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
rollout:
  model:
    model_type: fastwam
    model_path: /data/chenyiteng/models/fastwam/release-8eaceeb/robotwin_uncond_3cam_384.pt
    checkpoint_path: /data/chenyiteng/models/fastwam/release-8eaceeb/robotwin_uncond_3cam_384.pt
    dataset_stats_path: /data/chenyiteng/models/fastwam/release-8eaceeb/robotwin_uncond_3cam_384_dataset_stats.json
    precision: bf16
    is_lora: false
    action_dim: 14
    action_horizon: 32
    num_action_chunks: 24
    num_inference_steps: 10
    sigma_shift: 5.0
    text_cfg_scale: 1.0
    negative_prompt: ''
    rand_device: cpu
    tiled: false
    model_forward_batch_size: 2
    eval_seed: 0
    add_value_head: false
    rl:
      noise_level: 0.3
    fastwam:
      config_name: sim_robotwin
      task: robotwin_uncond_3cam_384_1e-4
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  collect_prev_infos: true
  enable_offload: true
  pipeline_stage_num: 1
weight_syncer:
  type: bucket
  bucket:
    bucket_size: 536870912
    bucket_dtype: null
    is_agent: false
    load_instant: true
    bucket_device: cpu
cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: 2,3
  tracer:
    enable: false
runner:
  task_type: embodied
  logger:
    log_path: /data/chenyiteng/results/rlinf-shenzhen/fastwam-grpo/runs/fastwam-grpo-smoke1-current-2gpu32x1-g8-b256-u1-m10-phys23-dcp-v3-roundtrip
    project_name: rlinf
    experiment_name: fastwam_grpo_smoke1_dcp_fresh
    logger_backends:
    - tensorboard
  max_epochs: 1000
  max_steps: 1
  only_eval: false
  val_check_interval: 100
  save_interval: 1
  weight_sync_interval: 1
  resume_dir: null
  ckpt_path: null
  per_worker_log: false
  per_worker_log_path: null
  overlap_env_bootstrap: false
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 8
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: true
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
reward:
  use_reward_model: false
critic:
  use_critic_model: false
