actor:
  model:
    model_type: openpi
    model_path: /data/chenyiteng/models/rlinf/RLinf-Pi0-RoboTwin-SFT-adjust_bottle@92684e50
    precision: null
    num_action_chunks: 50
    action_dim: 14
    is_lora: false
    lora_rank: 32
    use_proprio: true
    num_steps: 4
    add_value_head: false
    openpi:
      config_name: pi0_aloha_robotwin
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: 50
      num_steps: 4
      train_expert_only: true
      action_env_dim: 14
      noise_method: flow_sde
      add_value_head: false
      detach_critic_input: false
      use_dsrl: false
      dsrl_state_dim: 8
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_agg_q: mean
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims:
      - 128
      - 128
      - 128
      image_augmentation: false
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
    checkpoint_format: local_shard
    wrap_policy:
      transformer_layer_cls_to_wrap:
      - GemmaMLP
      - SiglipVisionEmbeddings
      - GemmaRMSNorm
      - GemmaRotaryEmbedding
      no_split_names:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - action_in_proj
      - action_out_proj
      - lm_head
      - state_proj
      - action_time_mlp_in
      - action_time_mlp_out
      - time_mlp_in
      - time_mlp_out
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 32
  global_batch_size: 1024
  seed: 1234
  enable_offload: true
  enable_drq: false
  optim:
    lr: 2.5e-05
    value_lr: 2.5e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 4
    lr_warmup_steps: 0
    lr_scheduler: constant
    min_lr: 2.5e-05
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: '6'
  tracer:
    enable: false
runner:
  task_type: embodied
  logger:
    log_path: /data/chenyiteng/results/rlinf-shenzhen/online-bc/pi0-adjust-bottle-smoke32x1-m4-gpu6-20260905-v6
    project_name: rlinf-online-bc
    experiment_name: pi0-adjust-bottle-online-bc-smoke32-m4-gpu6
    logger_backends:
    - tensorboard
  max_epochs: 2
  max_steps: -1
  only_eval: false
  val_check_interval: 1
  save_interval: 1
  resume_dir: null
  ckpt_path: null
  overlap_env_bootstrap: false
  per_worker_log: false
  per_worker_log_path: null
  weight_sync_interval: 1
algorithm:
  loss_type: online_bc
  adv_type: gae
  gamma: 0.99
  reward_coef: 1.0
  update_epoch: 2
  online_bc:
    data_path: /data/chenyiteng/results/rlinf-shenzhen/online-bc/pi0-adjust-bottle-smoke32x1-m4-gpu6-20260905-v6/success_data
    demo_weight: 0.0
    demo_data_path: null
  replay_buffer:
    min_buffer_size: 1
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  collect_prev_infos: false
  collect_final_values: false
  expert_model: null
  model:
    model_path: /data/chenyiteng/models/rlinf/RLinf-Pi0-RoboTwin-SFT-adjust_bottle@92684e50
    precision: null
reward:
  use_reward_model: false
critic:
  use_critic_model: false
