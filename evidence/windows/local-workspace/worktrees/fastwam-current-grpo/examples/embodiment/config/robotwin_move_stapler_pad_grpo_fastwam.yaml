defaults:
  - env/robotwin_move_stapler_pad@env.train
  - env/robotwin_move_stapler_pad@env.eval
  - model/fastwam_robotwin@actor.model
  - model/fastwam_robotwin@rollout.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/bucket_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: 0-1

runner:
  task_type: embodied
  logger:
    log_path: ../results/fastwam-current-grpo
    project_name: rlinf
    experiment_name: robotwin_move_stapler_pad_grpo_fastwam_2gpu32x4_g8
    logger_backends: [tensorboard]
  max_epochs: 1000
  max_steps: 100
  only_eval: false
  val_check_interval: 5
  save_interval: 10
  weight_sync_interval: 1
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 8
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 2
  adv_type: grpo
  loss_type: actor
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: true
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: EnvGroup
  enable_offload: true
  train:
    total_num_envs: 32
    rollout_epoch: 4
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    max_episode_steps: 192
    max_steps_per_rollout_epoch: 192
    assets_path: /data/chenyiteng/projects/rlinf-shenzhen/RoboTwin-RLinf-support
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/train_seeds.json
    center_crop: false
    enable_offload: true
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/train
    task_config:
      step_lim: 192
      save_path: ${runner.logger.log_path}/robotwin_data/train
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
  eval:
    total_num_envs: 32
    rollout_epoch: 1
    auto_reset: true
    ignore_terminations: true
    reward_coef: ${algorithm.reward_coef}
    group_size: 1
    max_episode_steps: 192
    max_steps_per_rollout_epoch: 192
    use_fixed_reset_state_ids: true
    is_eval: true
    assets_path: /data/chenyiteng/projects/rlinf-shenzhen/RoboTwin-RLinf-support
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_seeds.json
    center_crop: false
    enable_offload: true
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
    task_config:
      step_lim: 192
      save_path: ${runner.logger.log_path}/robotwin_data/eval
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true

rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  collect_prev_infos: true
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    checkpoint_path: ${actor.model.checkpoint_path}
    dataset_stats_path: ${actor.model.dataset_stats_path}
    precision: ${actor.model.precision}
    rl:
      noise_level: ${actor.model.rl.noise_level}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 1024
  seed: 1234
  enable_offload: false
  optim:
    lr: 5.0e-6
    value_lr: 1.1e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp2
    sharding_strategy: full_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    wrap_policy:
      no_split_names: ["__none__"]
    save_full_model_weights: false
    checkpoint_format: dcp
    cast_forward_inputs: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false

weight_syncer:
  type: bucket
  bucket:
    bucket_size: 536870912
    bucket_dtype: null
    bucket_device: cpu
    is_agent: false
    load_instant: true

reward:
  use_reward_model: false

critic:
  use_critic_model: false
