defaults:
  - env/robotwin_adjust_bottle@env.train
  - env/robotwin_adjust_bottle@env.eval
  - model/pi0@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: 0-1

runner:
  task_type: embodied
  use_training_pipeline: false
  overlap_env_bootstrap: false
  weight_sync_interval: 1
  logger:
    log_path: "/root/autodl-tmp/experiments/qam_pi0_robotwin"
    project_name: rlinf
    experiment_name: "robotwin_adjust_bottle_qam_openpi_formal_v1"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  # Source config is intentionally launch-closed.  A reviewed formal/smoke
  # command must override this after the P5 approval packet.
  max_steps: 0
  only_eval: false
  val_check_interval: -1
  save_interval: 25
  resume_dir: null
  ckpt_path: null

algorithm:
  loss_type: embodied_qam
  adv_type: gae
  gamma: 0.99
  reward_coef: 1.0
  qam:
    # The source remains launch-closed. A reviewed formal launch sets
    # phase=am_on/inv_temp>0; that mode still performs the counted critic-only
    # burn-in below before its first AM update.
    phase: collect
    online_only: true
    task_prompt: adjust the bottle

    flow_steps: 10
    gamma_slot: ${algorithm.gamma}
    rho: 0.5
    inv_temp: 0.0
    target_tau: 0.005

    num_q_heads: 10
    critic_hidden_dims: [512, 512, 512, 512]
    critic_lr: 3.0e-4
    critic_adam_beta1: 0.9
    critic_adam_beta2: 0.999
    critic_adam_eps: 1.0e-8
    critic_grad_clip: 1.0
    critic_init_seed: 2726

    # Capacity is per actor rank. Raw three-view uint8 observations make
    # 4096/rank about 11.3 GB before the smaller feature/action fields.
    replay_capacity: 4096
    min_replay_per_rank: 32
    warmup_global_inserts: 512
    q_only_updates_before_am: 512
    utd_ratio: 1.0
    max_updates_per_step: 32

env:
  group_name: "EnvGroup"
  enable_offload: false
  train:
    rollout_epoch: 1
    total_num_envs: 2
    auto_reset: false
    ignore_terminations: false
    reward_coef: ${algorithm.reward_coef}
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    group_size: 1
    assets_path: "/root/autodl-tmp/RoboTwin_RLinf"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/train_seeds.json
    center_crop: false
    task_config:
      task_name: adjust_bottle
      step_lim: 200
      planner_backend: mplib
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
  eval:
    rollout_epoch: 1
    total_num_envs: 2
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 200
    reward_coef: ${algorithm.reward_coef}
    max_steps_per_rollout_epoch: 200
    group_size: 1
    use_fixed_reset_state_ids: true
    is_eval: true
    assets_path: "/root/autodl-tmp/RoboTwin_RLinf"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
    center_crop: false
    task_config:
      task_name: adjust_bottle
      step_lim: 200
      planner_backend: mplib
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 64
  seed: 1234
  enable_offload: false
  model:
    precision: null
    model_path: "/root/autodl-tmp/models/rlinf/RLinf-Pi0-RoboTwin-SFT-adjust_bottle"
    num_action_chunks: 20
    action_dim: 14
    num_steps: 10
    add_value_head: false
    openpi_data:
      repo_id: physical-intelligence/robotwin
      default_prompt: adjust the bottle
      norm_stats_path: "/root/autodl-tmp/models/rlinf/RLinf-Pi0-RoboTwin-SFT-adjust_bottle/physical-intelligence/robotwin/norm_stats.json"
    openpi:
      config_name: "pi0_aloha_robotwin"
      num_images_in_input: 3
      action_horizon: 50
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      train_expert_only: true
      noise_method: flow_ode
      add_value_head: false
      detach_critic_input: true
      use_dsrl: false
      use_rlt: false
      use_qam: true
      qam_num_image_blocks: 3
      qam_projection_version: "pi0-fixed-prefix-active-v1"

  optim:
    lr: 2.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-8
    weight_decay: 0.0
    clip_grad: 1.0
    total_training_steps: 100000
    lr_warmup_steps: 0
    lr_scheduler: constant
    num_cycles: 0.5
    min_lr: 0.0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
