integration_design:
  first_smoke:
    replan_steps: 24
    action_horizon: 32
    denoise_steps: 10
    scheduler_infer_shift: 5.0
    episode_steps: 192
    rollout_steps: 192
    user_confirmed_at: "2026-07-17"
  probability_core:
    target_symbol: flow_sde_rollout
    train_eval_shared_function: true
    mode_parameter: deterministic
    official_singleton_infer_action_is_test_oracle_only: true
    schedule_authority: fastwam_official_45d8e145_scheduler_continuous
    probability_authority: rlinf_server_pin_6d0db56_openpi_sample_mean_var_val
    signed_delta_contract: "assert delta < 0; dt = -delta"
    first_step_sigma_denominator: next_schedule_t
    community_t_max_clamp_0_98: rejected
    std_floor_in_first_version: rejected
    stochastic_transition: single_shared_k_per_rollout_batch
    stochastic_k_range: all_steps_0_to_S_minus_1_uniform
    stochastic_k_status: user_selected_2026_07_17
    sigma_shift_source: standalone_resolved_config
    deterministic_state_dtype: model_dtype_official_scheduler_step
    stochastic_chain_dtype: float32
    model_forward_boundary: cast_latent_and_raw_timestep_to_model_dtype_then_upcast_velocity
  batch_core:
    official_public_infer_action_max_batch: 1
    model_internals_batch_native: true
    first_version_vae_path: official_wrapper_list_input_returns_stacked_batch
    singleton_fallback: forbidden
    fixed_resource_chunking: allowed_fail_fast
    randomness_scope: logical_rollout_batch_before_chunking
    chunk_inputs: shared_k_and_sliced_initial_latents_and_sde_epsilon
    partition_invariance_check: required_in_consolidated_parity_test
  fsdp2:
    authority: rlinf_server_pin_6d0db56_apply_fsdp2_to_model
    block_or_expert_wrap: disabled
    root_shard: true
    non_tied_embedding_wrap: preserve_pin_default
    use_orig_params_as_mechanism: false
    runtime_wrap_inventory_check: required_in_integration_smoke
    save_full_model_weights: false
  export:
    dcp_first_no_dist: true
    full_weights_input_compatibility_only: true
    official_payload_keys: [mot, proprio_encoder_optional, step, torch_dtype]
    schema_validation: exact_keys_shapes_dtypes_against_official_base_checkpoint
    p3_action_parity: resumed_rlinf_vs_exported_official_from_same_dcp
  registration:
    mechanism: builtin_register_model
    mechanism_authority: "rlinf server pin 6d0db56 _register_builtin_models + new_model_fsdp.rst"
    package_path: rlinf/models/embodiment/fastwam
    package_path_status: user_selected_2026_07_17
    external_alternative: RLINF_EXT_MODULE_for_rlinf_as_dependency_only
    maintain_both_paths: false
  environment:
    python: "3.11"
    torch: 2.7.1+cu128
    strategy: "keep pi0 golden and FastWAM-official oracle read-only; inspect pi0 freeze/list only as a reference; create a third joint venv from scratch at the final worktree path; pin final Torch before rebuilding CuRobo/CUDA extensions"
    joint_venv: /root/autodl-tmp/conda/envs/FastWAM-RLinf
    pi0_golden_backup: /root/autodl-tmp/backups/RLinf-pi0-venv-golden-20260717
    toppra: "0.6.3; Python 3.11 compatible adaptation, verified by render and adjust_bottle scripted expert"
  first_nonzero_exploration_smoke:
    noise_level: 0.1
    status: user_selected_2026_07_17
  implementation_validation_style:
    strategy: coherent_implementation_first_then_consolidated_high_information_checks
    micro_gate_per_symbol: false
