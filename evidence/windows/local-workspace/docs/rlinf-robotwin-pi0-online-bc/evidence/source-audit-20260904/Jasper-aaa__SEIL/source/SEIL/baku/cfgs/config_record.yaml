defaults:
  - _self_
  - agent: baku
  - suite: libero
  - dataloader: libero
  - override hydra/launcher: submitit_local

# Root Dir
root_dir: 

# misc
seed: 10000
device: cuda
save_video: true
save_train_video: false
use_tb: true
batch_size: 64

# experiment
obs_type: "pixels" # pixels, features
num_demos_per_task: 50
encoder_type: 'resnet' # base, resnet
policy_type: 'gpt' # mlp, gpt
policy_head: deterministic # deterministic, gmm, bet, diffusion, vqbet
use_proprio: true
use_language: true
use_actions: false
eval: true
prompt: text # text, goal, intermediate_goal
experiment: record
experiment_label:
benchmarking: false # for libero initialize
# action chunking
temporal_agg: true # aggregate actions over time
num_queries: 10

use_save_demo: false
save_demo_path: none
num_demo_per_round: none

# SAVE record
record: true
record_path: 
record_seed: ${now:%m%d%H%M%S} # Make sure random init state
env_aug: true
# expert dataset
expert_dataset: ${dataloader.bc_dataset}

# Load weights
bc_weight: 

hydra:
  run:
    dir: 
  sweep:
    dir: 
    subdir: ${hydra.job.num}
  launcher:
    tasks_per_node: 1
    nodes: 1
    submitit_folder: 
