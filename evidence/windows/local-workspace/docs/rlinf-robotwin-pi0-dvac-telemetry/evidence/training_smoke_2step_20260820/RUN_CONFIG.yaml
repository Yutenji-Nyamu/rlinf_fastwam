    max_episode_steps: 200
    is_eval: true
    assets_path: /root/autodl-tmp/idea2_dvac_train_wamppo/RoboTwin_RLinf
    seeds_path: /root/autodl-tmp/RLinf_idea2_dvac_train/rlinf/envs/robotwin/seeds/eval_seeds.json
