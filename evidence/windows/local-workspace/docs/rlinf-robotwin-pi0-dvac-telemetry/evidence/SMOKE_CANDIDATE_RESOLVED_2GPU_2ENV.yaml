  logger:
    log_path: /root/autodl-tmp/RLinf_idea2_dvac_pi0_robotwin/outputs/idea2_dvac_sft_smoke_2gpu_2env_v1
    project_name: rlinf
    experiment_name: idea2_dvac_sft_smoke_2gpu_2env_v1
    logger_backends:
      - tensorboard
  max_epochs: 1000
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
