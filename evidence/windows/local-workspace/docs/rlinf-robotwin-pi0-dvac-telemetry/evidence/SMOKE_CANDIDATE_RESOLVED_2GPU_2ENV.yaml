env:
  eval:
    env_type: robotwin
    total_num_envs: 2
    auto_reset: true
    ignore_terminations: true
    reward_coef: 1.0
    use_custom_reward: true
    use_rel_reward: true
    center_crop: false
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: true
    max_steps_per_rollout_epoch: 200
    max_episode_steps: 200
    is_eval: true
    assets_path: /root/autodl-tmp/RoboTwin_RLinf
    seeds_path: /root/autodl-tmp/RLinf_idea2_dvac_pi0_robotwin/rlinf/envs/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: true
      info_on_video: true
      video_base_dir: /root/autodl-tmp/RLinf_idea2_dvac_pi0_robotwin/outputs/idea2_dvac_sft_smoke_2gpu_2env_v1/video/eval
    enable_offload: false
    task_config:
      task_name: adjust_bottle
      step_lim: 200
      planner_backend: mplib
      render_freq: 0
      episode_num: 100
      use_seed: false
      save_freq: 15
      embodiment:
        - aloha-agilex
      language_num: 100
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      camera:
        head_camera_type: D435
        wrist_camera_type: D435
        collect_head_camera: true
        collect_wrist_camera: true
      data_type:
        rgb: true
        third_view: false
        depth: false
        pointcloud: false
        observer: false
        endpose: false
        qpos: true
        mesh_segmentation: false
        actor_segmentation: false
      pcd_down_sample_num: 1024
      pcd_crop: true
      save_path: ./data
      clear_cache_freq: 1
      collect_data: true
      eval_video_log: true
    rollout_epoch: 1
  group_name: EnvGroup
  enable_offload: true
rollout:
  model:
    model_type: openpi
    model_path: /root/autodl-tmp/models/rlinf/RLinf-Pi0-RoboTwin-SFT-adjust_bottle
    precision: null
    num_action_chunks: 50
    action_dim: 14
    is_lora: false
    lora_rank: 32
    use_proprio: true
    num_steps: 4
    add_value_head: true
    openpi:
      config_name: pi0_aloha_robotwin
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: 50
      num_steps: 4
      train_expert_only: true
      action_env_dim: 14
      noise_method: flow_sde
      add_value_head: true
      detach_critic_input: true
      use_dsrl: false
      dsrl_state_dim: 8
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_agg_q: mean
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims:
        - 128
        - 128
        - 128
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  dvac_telemetry:
    enabled: true
    output_dir: /root/autodl-tmp/RLinf_idea2_dvac_pi0_robotwin/outputs/idea2_dvac_sft_smoke_2gpu_2env_v1/dvac_telemetry
    save_query_inputs: true
    run_id: idea2_dvac_sft_smoke_2gpu_2env_v1
    common_base_commit: 6d0db56bf26f972cd27fa29535f5eb939e80e5bf
    source_commit: 61996e15cc7f5a32bd6012b61b20893d94636c82
    robotwin_commit: 481380fbd97cbf9ff830aedfb2279851e1e58969
    checkpoint_revision: 92684e50c8a3dcf13b76a06713e3152625967be1
    norm_stats_sha256: 649ed92b431bd70627febdb00b2385e35fcab5088e72a4e4a4845585f8ce4f6a
    seed_file_sha256: 194164f7380fd7cad2a8940ca93def01c2be865da265e4af1c463d73b2aa482f
    renderer: sapien
    launch_command: "cd /root/autodl-tmp/RLinf_idea2_dvac_pi0_robotwin && CUDA_VISIBLE_DEVICES=0,1 REPO_PATH=/root/autodl-tmp/RLinf_idea2_dvac_pi0_robotwin EMBODIED_PATH=/root/autodl-tmp/RLinf_idea2_dvac_pi0_robotwin/examples/embodiment PYTHONPATH=/root/autodl-tmp/RLinf_idea2_dvac_pi0_robotwin:/root/autodl-tmp/RoboTwin_RLinf timeout --signal=INT --kill-after=30s 15m /root/autodl-tmp/RLinf/.venv/bin/python evaluations/eval_embodied_agent.py --config-path /root/autodl-tmp/idea2_dvac_run_configs --config-name idea2_dvac_sft_smoke_2gpu_2env_v1"
cluster:
