  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;!doctype html&gt;
&lt;html lang=&quot;zh-CN&quot;&gt;
&lt;head&gt;
  &lt;meta charset=&quot;utf-8&quot;&gt;
  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
  &lt;title&gt;RLT Stage 1 内存结构&lt;/title&gt;
  &lt;style&gt;
    :root {
      color-scheme: light dark;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d8e0eb;
      --grid: #e8edf4;
      --rss: #8b5cf6;
      --anon: #0f9d8a;
      --total: #e76f51;
      --file: #3b82f6;
      --avail: #16a34a;
      --accent-bg: #edf7f5;
      --shadow: 0 10px 30px rgba(23, 32, 51, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1421;
        --panel: #151e2d;
        --ink: #eef3fb;
        --muted: #a5b1c5;
        --line: #2b3a50;
        --grid: #273448;
        --rss: #a78bfa;
        --anon: #2dd4bf;
        --total: #fb8b72;
        --file: #60a5fa;
        --avail: #4ade80;
        --accent-bg: #132b2a;
        --shadow: 0 10px 30px rgba(0, 0, 0, .25);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;,
        &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;
    }
    main {
      width: min(1120px, calc(100% - 28px));
      margin: 28px auto 38px;
    }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 38px);
      letter-spacing: -.035em;
      line-height: 1.08;
    }
    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }
    .status {
      flex: 0 0 auto;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--accent-bg);
      color: var(--anon);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .card, .chart-card, .explain {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    .card { padding: 16px; min-height: 116px; }
    .eyebrow {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .value {
      margin-top: 7px;
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 760;
      letter-spacing: -.04em;
    }
    .detail {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .chart-card {
      position: relative;
      min-width: 0;
      padding: 16px 16px 10px;
    }
    .chart-card.wide { grid-column: 1 / -1; }
    .chart-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 4px;
    }
    h2 { margin: 0; font-size: 16px; letter-spacing: -.015em; }
    .chart-note {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px 12px;
      color: var(--muted);
      font-size: 11px;
    }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .swatch { width: 18px; height: 3px; border-radius: 2px; }
    svg { display: block; width: 100%; height: auto; min-height: 220px; }
    .tooltip {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -108%);
      min-width: 148px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: var(--shadow);
      color: var(--ink);
      font-size: 11px;
      line-height: 1.55;
      transition: opacity .08s ease;
    }
    .tooltip strong { display: block; margin-bottom: 2px; font-size: 12px; }
    .explain {
      margin-top: 14px;
      padding: 16px 18px;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 22px;
    }
    .explain h2 { margin-bottom: 7px; }
    .explain p, .explain li {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .explain p { margin: 0; }
    .explain ul { margin: 0; padding-left: 18px; }
    .explain strong { color: var(--ink); }
    footer {
      margin-top: 12px;
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }
    @media (max-width: 760px) {
      header { align-items: flex-start; flex-direction: column; }
      .cards { grid-template-columns: 1fr 1fr; }
      .charts { grid-template-columns: 1fr; }
      .chart-card.wide { grid-column: auto; }
      .explain { grid-template-columns: 1fr; }
    }
    @media (max-width: 420px) {
      main { width: min(100% - 18px, 1120px); margin-top: 16px; }
      .cards { grid-template-columns: 1fr; }
      .chart-head { flex-direction: column; }
      .legend { justify-content: flex-start; }
      .card { min-height: auto; }
    }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;main&gt;
  &lt;header&gt;
    &lt;div&gt;
      &lt;h1&gt;Stage 1 内存不是一个数字&lt;/h1&gt;
      &lt;p class=&quot;subtitle&quot;&gt;RLT token 2,000-step 正式训练 · 1,455 个资源采样点 · 28.9 分钟&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;status&quot;&gt;无 OOM · 无主机内存压力&lt;/div&gt;
  &lt;/header&gt;

  &lt;section class=&quot;cards&quot; aria-label=&quot;峰值摘要&quot;&gt;
    &lt;article class=&quot;card&quot;&gt;
      &lt;div class=&quot;eyebrow&quot;&gt;训练进程 RSS 峰值&lt;/div&gt;
      &lt;div class=&quot;value&quot; style=&quot;color:var(--rss)&quot;&gt;38.51 GiB&lt;/div&gt;
      &lt;div class=&quot;detail&quot;&gt;仅匹配的两 rank 进程；稳态约 16.1 GiB&lt;/div&gt;
    &lt;/article&gt;
    &lt;article class=&quot;card&quot;&gt;
      &lt;div class=&quot;eyebrow&quot;&gt;cgroup anon 峰值&lt;/div&gt;
      &lt;div class=&quot;value&quot; style=&quot;color:var(--anon)&quot;&gt;39.53 GiB&lt;/div&gt;
      &lt;div class=&quot;detail&quot;&gt;整个容器的匿名常驻分配，最接近真实 RAM 工作集&lt;/div&gt;
    &lt;/article&gt;
    &lt;article class=&quot;card&quot;&gt;
      &lt;div class=&quot;eyebrow&quot;&gt;cgroup accounted 峰值&lt;/div&gt;
      &lt;div class=&quot;value&quot; style=&quot;color:var(--total)&quot;&gt;240.00 GiB&lt;/div&gt;
      &lt;div class=&quot;detail&quot;&gt;其中 file cache 峰值 229.94 GiB，可回收，不是模型泄漏&lt;/div&gt;
    &lt;/article&gt;
    &lt;article class=&quot;card&quot;&gt;
      &lt;div class=&quot;eyebrow&quot;&gt;主机 available 最低&lt;/div&gt;
      &lt;div class=&quot;value&quot; style=&quot;color:var(--avail)&quot;&gt;928.83 GiB&lt;/div&gt;
      &lt;div class=&quot;detail&quot;&gt;总 RAM 约 1.0 TiB；全程保留巨大余量&lt;/div&gt;
    &lt;/article&gt;
  &lt;/section&gt;

  &lt;section class=&quot;charts&quot;&gt;
    &lt;article class=&quot;chart-card&quot;&gt;
      &lt;div class=&quot;chart-head&quot;&gt;
        &lt;div&gt;
          &lt;h2&gt;实际常驻工作集&lt;/h2&gt;
          &lt;p class=&quot;chart-note&quot;&gt;初始化与 endpoint 保存产生短峰；中段稳定。&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;legend&quot;&gt;
          &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:var(--rss)&quot;&gt;&lt;/i&gt;matched RSS&lt;/span&gt;
          &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:var(--anon)&quot;&gt;&lt;/i&gt;cgroup anon&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;svg id=&quot;resident&quot; viewBox=&quot;0 0 900 300&quot; role=&quot;img&quot; aria-label=&quot;训练进程 RSS 与 cgroup 匿名内存曲线&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;tooltip&quot; id=&quot;resident-tip&quot;&gt;&lt;/div&gt;
    &lt;/article&gt;

    &lt;article class=&quot;chart-card&quot;&gt;
      &lt;div class=&quot;chart-head&quot;&gt;
        &lt;div&gt;
          &lt;h2&gt;容器总记账与文件缓存&lt;/h2&gt;
          &lt;p class=&quot;chart-note&quot;&gt;约 200–230 GiB 来自页缓存，因此 total 远高于 RSS。&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;legend&quot;&gt;
          &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:var(--total)&quot;&gt;&lt;/i&gt;cgroup total&lt;/span&gt;
          &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:var(--file)&quot;&gt;&lt;/i&gt;file cache&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;svg id=&quot;accounted&quot; viewBox=&quot;0 0 900 300&quot; role=&quot;img&quot; aria-label=&quot;cgroup 总内存与文件缓存曲线&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;tooltip&quot; id=&quot;accounted-tip&quot;&gt;&lt;/div&gt;
    &lt;/article&gt;

    &lt;article class=&quot;chart-card wide&quot;&gt;
      &lt;div class=&quot;chart-head&quot;&gt;
        &lt;div&gt;
          &lt;h2&gt;主机可用内存&lt;/h2&gt;
          &lt;p class=&quot;chart-note&quot;&gt;最低点仍有 928.83 GiB；训练结束后回到约 979 GiB。&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;legend&quot;&gt;
          &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:var(--avail)&quot;&gt;&lt;/i&gt;host available&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;svg id=&quot;headroom&quot; viewBox=&quot;0 0 900 230&quot; role=&quot;img&quot; aria-label=&quot;主机可用内存曲线&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;tooltip&quot; id=&quot;headroom-tip&quot;&gt;&lt;/div&gt;
    &lt;/article&gt;
  &lt;/section&gt;

  &lt;section class=&quot;explain&quot;&gt;
    &lt;div&gt;
      &lt;h2&gt;该看哪个值？&lt;/h2&gt;
      &lt;p&gt;&lt;strong&gt;模型/进程自身：&lt;/strong&gt;看 matched RSS。&lt;strong&gt;容器真实匿名分配：&lt;/strong&gt;看
        cgroup anon。两者峰值接近，说明约 39 GiB 是训练相关常驻内存的合理量级。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;h2&gt;为什么 total 有 240 GiB？&lt;/h2&gt;
      &lt;ul&gt;
        &lt;li&gt;cgroup total 包含匿名内存、文件页缓存及少量内核记账。&lt;/li&gt;
        &lt;li&gt;file cache 可在内存紧张时回收，不应当作 230 GiB 模型占用。&lt;/li&gt;
        &lt;li&gt;host available 始终很高，因此没有 swap、OOM 或泄漏信号。&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/section&gt;
  &lt;footer&gt;数据源：formal runtime/resources.csv；曲线约每 30 秒下采样，并补入精确峰值点。&lt;/footer&gt;
&lt;/main&gt;

function drawChart(id, series, domain, yTicks, height = 300) {

    tip.style.left = `${Math.max(90, Math.min(rect.width-90, xx/W*rect.width))}px`;
    tip.style.top = `${Math.min(...series.map(s=&gt;y(point[s.key])))/H*rect.height + 32}px`;
    tip.style.opacity = 1;
  });
