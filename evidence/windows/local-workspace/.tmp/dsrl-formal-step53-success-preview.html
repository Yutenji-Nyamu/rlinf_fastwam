  transform: translate(2px, -50%);

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;dsrl-step53-success-root&quot;&gt;
  &lt;svg role=&quot;img&quot; aria-labelledby=&quot;dsrl-step53-success-title dsrl-step53-success-desc&quot;&gt;&lt;/svg&gt;
  &lt;div class=&quot;text-small text-muted&quot; data-detail&gt;
    Latest: trailing-20 train success 75%; formal eval 10/12 at 33.16k requested interactions.
  &lt;/div&gt;
  &lt;div class=&quot;tooltip&quot; data-tooltip-box hidden&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;style&gt;
  #dsrl-step53-success-root {
    position: relative;
    width: 100%;
    color: var(--foreground);
  }
  #dsrl-step53-success-root svg {
    display: block;
    width: 100%;
  }
  #dsrl-step53-success-root .grid {
    stroke: var(--border);
    stroke-width: 1;
  }
  #dsrl-step53-success-root .axis {
    stroke: var(--muted-foreground);
    stroke-width: 1;
  }
  #dsrl-step53-success-root .tick-label,
  #dsrl-step53-success-root .axis-label {
    fill: var(--muted-foreground);
    font-weight: 400;
  }
  #dsrl-step53-success-root .series-label {
    fill: var(--foreground);
    font-weight: 500;
  }
  #dsrl-step53-success-root .train-line {
    fill: none;
    stroke: var(--viz-series-1);
    stroke-width: 1.5;
    opacity: 0.7;
  }
  #dsrl-step53-success-root .rolling-line {
    fill: none;
    stroke: var(--viz-series-2);
    stroke-width: 3;
  }
  #dsrl-step53-success-root .train-point {
    fill: var(--viz-series-1);
  }
  #dsrl-step53-success-root .rolling-point {
    fill: var(--viz-series-2);
  }
  #dsrl-step53-success-root .eval-mark,
  #dsrl-step53-success-root .eval-error {
    fill: var(--viz-series-3);
    stroke: var(--viz-series-3);
  }
  #dsrl-step53-success-root .eval-error {
    stroke-width: 2;
  }
  #dsrl-step53-success-root .warmup {
    stroke: var(--muted-foreground);
    stroke-width: 1.5;
    stroke-dasharray: 5 5;
  }
  #dsrl-step53-success-root [data-detail] {
    margin-top: 0.35rem;
    min-height: 1.25rem;
  }
  #dsrl-step53-success-root [data-tooltip-box] {
    position: absolute;
    pointer-events: none;
    transform: translate(-50%, calc(-100% - 8px));
    white-space: nowrap;
  }
&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&quot;dsrl-step53-success-root&quot;);
  const svg = root.querySelector(&quot;svg&quot;);
  const detail = root.querySelector(&quot;[data-detail]&quot;);
  const tooltip = root.querySelector(&quot;[data-tooltip-box]&quot;);
  const ns = &quot;http://www.w3.org/2000/svg&quot;;

  const interactions = [
    0.80, 1.60, 2.32, 3.12, 3.92, 4.72, 5.52, 6.32, 7.12, 7.92,
    8.64, 9.44, 10.24, 10.90, 11.70, 12.42, 13.14, 13.86, 14.58,
    15.22, 15.94, 16.50, 17.06, 17.70, 18.14, 18.86, 19.42, 20.12,
    20.68, 21.24, 21.72, 22.32, 22.92, 23.42, 23.96, 24.50, 25.12,
    25.82, 26.44, 27.06, 27.66, 28.10, 28.64, 29.06, 29.50, 29.92,
    30.40, 30.94, 31.48, 32.00, 32.60, 33.16, 33.62
  ];
  const trainRates = [
    0, 0, .25, 0, 0, 0, 0, 0, 0, 0, .25, 0, 0, .5, 0, .25, .25,
    .25, .25, .5, .25, .75, .75, .5, 1, .25, .75, .5, .75, .75,
    1, .75, .5, .75, .75, .75, .5, .25, .5, .5, .5, 1, .75, 1,
    1, 1, 1, .75, .75, .75, .5, .75, 1
  ];
  const rollingRates = [
    0, 0, .083, .063, .05, .05, .05, 0, 0, 0, .05, .05, .05, .15,
    .15, .15, .20, .25, .20, .30, .30, .40, .50, .55, .65, .65,
    .65, .60, .65, .60, .75, .75, .75, .75, .75, .70, .65, .60,
    .55, .50, .45, .55, .65, .75, .85, .95, .95, .95, .90, .85,
    .75, .70, .75
  ];
  const train = interactions.map((value, index) =&gt; [index + 1, value, trainRates[index]]);
  const rolling = interactions.map((value, index) =&gt; [index + 1, value, rollingRates[index]]);
  const evaluations = [
    { step: 13, x: 10.24, y: .083, low: .015, high: .354, count: &quot;1/12&quot; },
    { step: 26, x: 18.86, y: .583, low: .320, high: .807, count: &quot;7/12&quot; },
    { step: 39, x: 26.44, y: .667, low: .391, high: .862, count: &quot;8/12&quot; },
    { step: 52, x: 33.16, y: .833, low: .552, high: .953, count: &quot;10/12&quot; }
  ];

  function element(name, attrs = {}) {
    const node = document.createElementNS(ns, name);
    Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, value));
    return node;
  }

  function render() {
    const width = Math.max(320, Math.round(root.getBoundingClientRect().width || 736));
    const height = width &lt; 500 ? 390 : 340;
    const margin = {
      top: 18,
      right: width &lt; 500 ? 22 : 44,
      bottom: 54,
      left: width &lt; 500 ? 48 : 58
    };
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;
    const xMax = 35;
    const x = value =&gt; margin.left + value / xMax * innerWidth;
    const y = value =&gt; margin.top + (1 - value) * innerHeight;

    svg.replaceChildren();
    svg.setAttribute(&quot;viewBox&quot;, `0 0 ${width} ${height}`);
    svg.setAttribute(&quot;height&quot;, height);
    const title = element(&quot;title&quot;, { id: &quot;dsrl-step53-success-title&quot; });
    title.textContent = &quot;DSRL success through global step 53&quot;;
    const desc = element(&quot;desc&quot;, { id: &quot;dsrl-step53-success-desc&quot; });
    desc.textContent = &quot;Formal evaluation rises from 1 of 12 at step 13 to 10 of 12 at step 52. The latest trailing 20 training episodes are 75 percent successful.&quot;;
    svg.append(title, desc);

    [0, .25, .5, .75, 1].forEach(value =&gt; {
      svg.appendChild(element(&quot;line&quot;, {
        x1: margin.left, y1: y(value), x2: width - margin.right, y2: y(value), class: &quot;grid&quot;
      }));
      const label = element(&quot;text&quot;, {
        x: margin.left - 9, y: y(value) + 4, &quot;text-anchor&quot;: &quot;end&quot;,
        class: &quot;tick-label text-small&quot;
      });
      label.textContent = `${Math.round(value * 100)}%`;
      svg.appendChild(label);
    });
    [0, 5, 10, 15, 20, 25, 30, 35].forEach(value =&gt; {
      svg.appendChild(element(&quot;line&quot;, {
        x1: x(value), y1: margin.top, x2: x(value), y2: height - margin.bottom, class: &quot;grid&quot;
      }));
      const label = element(&quot;text&quot;, {
        x: x(value), y: height - margin.bottom + 22, &quot;text-anchor&quot;: &quot;middle&quot;,
        class: &quot;tick-label text-small&quot;
      });
      label.textContent = `${value}k`;
      svg.appendChild(label);
    });
    svg.appendChild(element(&quot;line&quot;, {
      x1: margin.left, y1: height - margin.bottom, x2: width - margin.right,
      y2: height - margin.bottom, class: &quot;axis&quot;
    }));
    svg.appendChild(element(&quot;line&quot;, {
      x1: margin.left, y1: margin.top, x2: margin.left,
      y2: height - margin.bottom, class: &quot;axis&quot;
    }));
    const xLabel = element(&quot;text&quot;, {
      x: margin.left + innerWidth / 2, y: height - 12, &quot;text-anchor&quot;: &quot;middle&quot;,
      class: &quot;axis-label text-small&quot;
    });
    xLabel.textContent = &quot;Cumulative requested primitive interactions&quot;;
    svg.appendChild(xLabel);

    const warmupX = x(10.24);
    svg.appendChild(element(&quot;line&quot;, {
      x1: warmupX, y1: margin.top, x2: warmupX, y2: height - margin.bottom, class: &quot;warmup&quot;
    }));
    const warmupLabel = element(&quot;text&quot;, {
      x: warmupX + 6, y: margin.top + 14, class: &quot;tick-label text-small&quot;
    });
    warmupLabel.textContent = &quot;learned rollout&quot;;
    svg.appendChild(warmupLabel);

    const pathFor = series =&gt; series.map((point, index) =&gt;
      `${index ? &quot;L&quot; : &quot;M&quot;}${x(point[1]).toFixed(1)},${y(point[2]).toFixed(1)}`
    ).join(&quot; &quot;);
    svg.appendChild(element(&quot;path&quot;, { d: pathFor(train), class: &quot;train-line&quot; }));
    svg.appendChild(element(&quot;path&quot;, { d: pathFor(rolling), class: &quot;rolling-line&quot; }));

    function attachPoint(node, point, kind) {
      const message = `${kind}: step ${point[0]}, ${point[1].toFixed(2)}k interactions, ${Math.round(point[2] * 100)}%`;
      node.addEventListener(&quot;mouseenter&quot;, () =&gt; {
        detail.textContent = message;
        tooltip.textContent = message;
        tooltip.hidden = false;
        const svgBox = svg.getBoundingClientRect();
        const rootBox = root.getBoundingClientRect();
        tooltip.style.left = `${svgBox.left - rootBox.left + x(point[1]) / width * svgBox.width}px`;
        tooltip.style.top = `${svgBox.top - rootBox.top + y(point[2]) / height * svgBox.height}px`;
      });
      node.addEventListener(&quot;mouseleave&quot;, () =&gt; {
        tooltip.hidden = true;
      });
    }

    train.forEach(point =&gt; {
      const node = element(&quot;circle&quot;, {
        cx: x(point[1]), cy: y(point[2]), r: width &lt; 500 ? 2.5 : 3.1, class: &quot;train-point&quot;
      });
      attachPoint(node, point, &quot;train cycle&quot;);
      svg.appendChild(node);
    });
    rolling.forEach(point =&gt; {
      const node = element(&quot;circle&quot;, {
        cx: x(point[1]), cy: y(point[2]), r: width &lt; 500 ? 2.3 : 2.9, class: &quot;rolling-point&quot;
      });
      attachPoint(node, point, &quot;trailing 20 episodes&quot;);
      svg.appendChild(node);
    });

    evaluations.forEach(point =&gt; {
      svg.appendChild(element(&quot;line&quot;, {
        x1: x(point.x), y1: y(point.low), x2: x(point.x), y2: y(point.high), class: &quot;eval-error&quot;
      }));
      svg.appendChild(element(&quot;line&quot;, {
        x1: x(point.x) - 5, y1: y(point.low), x2: x(point.x) + 5, y2: y(point.low), class: &quot;eval-error&quot;
      }));
      svg.appendChild(element(&quot;line&quot;, {
        x1: x(point.x) - 5, y1: y(point.high), x2: x(point.x) + 5, y2: y(point.high), class: &quot;eval-error&quot;
      }));
      const mark = element(&quot;rect&quot;, {
        x: x(point.x) - 5, y: y(point.y) - 5, width: 10, height: 10,
        transform: `rotate(45 ${x(point.x)} ${y(point.y)})`, class: &quot;eval-mark&quot;
      });
      const message = `formal eval: step ${point.step}, ${point.x.toFixed(2)}k interactions, ${point.count} = ${Math.round(point.y * 100)}%`;
      mark.addEventListener(&quot;mouseenter&quot;, () =&gt; {
        detail.textContent = message;
        tooltip.textContent = message;
        tooltip.hidden = false;
        const svgBox = svg.getBoundingClientRect();
        const rootBox = root.getBoundingClientRect();
        tooltip.style.left = `${svgBox.left - rootBox.left + x(point.x) / width * svgBox.width}px`;
        tooltip.style.top = `${svgBox.top - rootBox.top + y(point.y) / height * svgBox.height}px`;
      });
      mark.addEventListener(&quot;mouseleave&quot;, () =&gt; {
        tooltip.hidden = true;
      });
      svg.appendChild(mark);
    });

    if (width &gt;= 500) {
      const rollingLast = rolling.at(-1);
      const rollingLabel = element(&quot;text&quot;, {
        x: x(rollingLast[1]) - 8, y: y(rollingLast[2]) + 19,
        &quot;text-anchor&quot;: &quot;end&quot;, class: &quot;series-label text-small&quot;
      });
      rollingLabel.textContent = &quot;trailing-20: 75%&quot;;
      const evalLast = evaluations.at(-1);
      const evalLabel = element(&quot;text&quot;, {
        x: x(evalLast.x) - 8, y: y(evalLast.y) - 12,
        &quot;text-anchor&quot;: &quot;end&quot;, class: &quot;series-label text-small&quot;
      });
      evalLabel.textContent = &quot;formal eval: 10/12&quot;;
      svg.append(rollingLabel, evalLabel);
    }
  }

  new ResizeObserver(render).observe(root);
  render();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
