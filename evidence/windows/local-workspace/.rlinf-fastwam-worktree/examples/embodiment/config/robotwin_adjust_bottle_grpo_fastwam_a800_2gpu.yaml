defaults:
  - env/robotwin_adjust_bottle@env.train
  - env/robotwin_adjust_bottle@env.eval
  - model/fastwam_robotwin@actor.model
  - model/fastwam_robotwin@rollout.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/bucket_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: 0-1

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_adjust_bottle_grpo_fastwam_a800_2gpu"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: 100

  only_eval: false
  val_check_interval: -1
  save_interval: 10
  weight_sync_interval: 1

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 8
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level

  # One pass is the community Fast-WAM recipe and avoids stale-ratio reuse.
  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"

  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  # Same useful-group filter as the successful pi0 baseline and community recipe.
  filter_rewards: true
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"

  train:
    # 16 concurrent envs x 4 epochs = 64 trajectories / 8 GRPO groups.
    # Each trajectory contributes 192 / 24 = 8 real replay transitions, so one
    # RL step contains 512 actor samples = four global batches of 128.
    rollout_epoch: 4
    total_num_envs: 16
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}

    # Fast-WAM executes N=24 from an H=32 prediction; 192 is exactly 8 chunks.
    max_episode_steps: 192
    max_steps_per_rollout_epoch: 192

    assets_path: /root/autodl-tmp/RoboTwin_RLinf
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/train_seeds.json
    center_crop: false
    enable_offload: true

    video_cfg:
      save_video: false

    task_config:
      step_lim: 192
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

  eval:
    rollout_epoch: 1
    total_num_envs: 2
    reward_coef: ${algorithm.reward_coef}
    group_size: 1

    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 192
    max_steps_per_rollout_epoch: 192

    use_fixed_reset_state_ids: false
    is_eval: true
    assets_path: /root/autodl-tmp/RoboTwin_RLinf
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_seeds.json
    center_crop: false
    enable_offload: false

    video_cfg:
      save_video: false

    task_config:
      step_lim: 192
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"

  # Preserve the real behavior logprob and tensor-only Fast-WAM replay trace.
  recompute_logprobs: false
  collect_prev_infos: true

  enable_offload: false
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
    # Keep behavior and actor distributions identical.
    rl:
      noise_level: ${actor.model.rl.noise_level}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  model:
    # Community Fast-WAM actually learned with 0.3/0.6; use the lower proven
    # setting for formal training. The one-step engineering smoke stays at 0.1.
    rl:
      noise_level: 0.3

  # Memory-safe values already exercised by the real-checkpoint model probe.
  micro_batch_size: 2
  global_batch_size: 128
  seed: 1234
  enable_offload: false

  optim:
    # Stay close to the successful RoboTwin pi0 5.6e-6 baseline while remaining
    # 4x below the community Fast-WAM 2e-5 runs that actually learned.
    lr: 5.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp2"
    sharding_strategy: "full_shard"

    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true

    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false

    # Whole-model root shard preserves Fast-WAM's cross-expert MoT calls.
    wrap_policy:
      no_split_names: ["__none__"]

    # Standard RLinf DCP remains the authoritative resumable checkpoint.
    save_full_model_weights: false

    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

    # Replay chains/logprobs stay FP32; the policy casts only model inputs to BF16.
    cast_forward_inputs: false

    amp_autocast:
      enabled: false
      precision: bf16

    grad_scaler:
      enabled: false

weight_syncer:
  type: bucket
  bucket:
    bucket_size: 536870912
    bucket_dtype: null
    # AutoDL containers can block pidfd_getfd used by CUDA IPC. CPU staging is
    # an RLinf-native bucket mode and preserves the synchronized tensor values.
    bucket_device: cpu
    is_agent: false
    load_instant: true

reward:
  use_reward_model: false

critic:
  use_critic_model: false
