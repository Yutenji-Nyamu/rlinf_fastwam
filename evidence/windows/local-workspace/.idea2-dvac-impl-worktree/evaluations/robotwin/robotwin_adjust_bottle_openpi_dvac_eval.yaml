defaults:
  - env/robotwin_adjust_bottle@env.eval
  - model/pi0@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env, rollout: 0-7

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_adjust_bottle_pi0_dvac"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  only_eval: True
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"
  enable_offload: True
  eval:
    rollout_epoch: 1
    total_num_envs: 128
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 200
    reward_coef: 1.0
    max_steps_per_rollout_epoch: 200
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    assets_path: "/path/to/robotwin_assets"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    center_crop: False
    task_config:
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1
  dvac_telemetry:
    enabled: false
    output_dir: ${runner.logger.log_path}/dvac_telemetry
    save_query_inputs: true
    run_id: null
    common_base_commit: "6d0db56bf26f972cd27fa29535f5eb939e80e5bf"
    source_commit: null
    robotwin_commit: null
    checkpoint_revision: "92684e50c8a3dcf13b76a06713e3152625967be1"
    norm_stats_sha256: "649ed92b431bd70627febdb00b2385e35fcab5088e72a4e4a4845585f8ce4f6a"
    seed_file_sha256: null
    renderer: "sapien"
    launch_command: null
  model:
    model_path: "/path/to/RLinf/RLinf-Pi0-RoboTwin-SFT-adjust_bottle"
    num_action_chunks: 50
    add_value_head: True
    action_dim: 14
    openpi:
      config_name: "pi0_aloha_robotwin"
      num_images_in_input: 3
      detach_critic_input: True
