defaults:
  - env/robotwin_adjust_bottle@env.train
  - env/robotwin_adjust_bottle@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  # Base method config only. The approved smoke/formal overlay owns GPU count.
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:RLT_LOG_ROOT,/data/chenyiteng/results/rlinf-rlt}
    project_name: rlinf-rlt
    experiment_name: robotwin_adjust_bottle_rlt_stage2_ac_mlp_current
    logger_backends: [tensorboard]
  max_epochs: 1000
  # Deliberately non-launching base; an approved run supplies its cycle budget.
  max_steps: 0
  only_eval: false
  weight_sync_interval: 1
  val_check_interval: 10
  save_interval: 10
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 5
  group_size: 1
  adv_type: embodied_sac
  loss_type: rlt_ac
  loss_agg_func: token-mean
  agg_q: min
  actor_agg_q: q1
  enable_drq: false
  q_head_type: ${actor.model.q_head_type}
  bootstrap_type: standard
  gamma: 0.99
  tau: 0.005

  # RoboTwin V1: reference before readiness, student afterward, no expert gate.
  rlt_route:
    type: full_task
  rlt_transition_replay:
    enable: true
    compact: true
    bootstrap_on_truncation: true
  rlt_schedule:
    enable: true
    max_updates_per_train_step: 400
    warmup_min_size: 500
    warmup_post_collect_updates: 5000
    train_every_episodes: 0
    train_every_transitions: 1

  q_weight: 1.0
  bc_weight: 1.0
  reference_dropout_prob: 0.5
  actor_weight_schedule:
    enable: true
    warmup_updates: 5000
    ramp_updates: 10000
    warmup_bc_weight: 7.0
    warmup_q_weight: 0.05
    online_bc_weight: 2.5
    online_q_weight: 0.45
  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: true
    cache_size: 15000
    sample_window_size: 15000
    min_buffer_size: 1
    auto_save: false
  target_update_freq: 1
  target_update_type: all
  critic_actor_ratio: 2
  critic_subsample_size: 0
  backup_entropy: false

  # Sidecar state is saved on fresh runs too; unresolved artifact identity is
  # allowed to compose but rejected before save/resume.
  rlt_resume:
    enable: true
    schema_version: 1
    contract:
      current_base_commit: 7d07a4212ee6858cc333e1d4fab7a37256d1f839
      model_identity: exact_pi0
      reconstruction: current_causal_ar
      stage1_manifest_path: ${oc.env:RLT_STAGE1_MANIFEST_PATH,UNRESOLVED_RLT_STAGE1_MANIFEST_PATH}
      stage1_manifest_id: ${oc.env:RLT_STAGE1_MANIFEST_ID,UNRESOLVED_RLT_STAGE1_MANIFEST_ID}
      stage1_manifest_sha256: ${oc.env:RLT_STAGE1_MANIFEST_SHA256,UNRESOLVED_RLT_STAGE1_MANIFEST_SHA256}
      norm_stats_sha256: ${oc.env:RLT_NORM_STATS_SHA256,UNRESOLVED_RLT_NORM_STATS_SHA256}
      train_vla: false
      prefix_seq_len: 768
      image_only: true
      use_mask: true
      z_dim: 2048
      action_horizon: 50
      action_chunk: 10
      action_dim: 14
      canonical_adapter_version: robotwin_aloha_canonical_v1
      route: full_task
      replay: compact_transition
      bootstrap: pure_truncation_only

env:
  group_name: EnvGroup
  enable_offload: true
  train:
    enable_offload: true
    rollout_epoch: 1
    # Old AutoDL 4-env/100-cycle pilot candidate; the later 8-env/250-cycle
    # formal used an overlay. The approved H100 launch owns the final value.
    total_num_envs: 4
    auto_reset: false
    ignore_terminations: false
    use_rel_reward: false
    reward_coef: 1.0
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    group_size: ${algorithm.group_size}
    assets_path: ${oc.env:ROBOTWIN_ASSETS_PATH,/data/chenyiteng/projects/rlinf-shenzhen/RoboTwin-RLinf-support}
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/train_seeds.json
    center_crop: false
    video_cfg:
      save_video: false
    task_config:
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
  eval:
    rollout_epoch: 1
    total_num_envs: 4
    auto_reset: true
    ignore_terminations: true
    use_rel_reward: false
    reward_coef: 1.0
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    group_size: 1
    use_fixed_reset_state_ids: true
    is_eval: true
    assets_path: ${oc.env:ROBOTWIN_ASSETS_PATH,/data/chenyiteng/projects/rlinf-shenzhen/RoboTwin-RLinf-support}
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_seeds.json
    center_crop: false
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
    task_config:
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    model_type: ${actor.model.model_type}
    model_path: null
    precision: ${actor.model.precision}
    action_dim: ${actor.model.action_dim}
    num_action_chunks: ${actor.model.num_action_chunks}
    ref_num_action_chunks: ${actor.model.ref_num_action_chunks}
    z_dim: ${actor.model.z_dim}
    proprio_dim: ${actor.model.proprio_dim}
    add_q_head: ${actor.model.add_q_head}
    q_head_type: ${actor.model.q_head_type}
    fixed_std: ${actor.model.fixed_std}
    is_lora: false
    lora_rank: 32
  rlt_feature_model:
    model_type: openpi
    model_path: ${oc.env:RLT_STAGE1_MODEL_PATH}
    precision: null
    num_action_chunks: ${actor.model.ref_num_action_chunks}
    action_dim: ${actor.model.action_dim}
    add_value_head: false
    is_lora: false
    lora_rank: 32
    openpi_data:
      repo_id: physical-intelligence/robotwin
      default_prompt: adjust the bottle
      norm_stats_path: ${oc.env:ROBOTWIN_PI0_NORM_STATS_PATH,/data/chenyiteng/models/rlinf/RLinf-Pi0-RoboTwin-SFT-adjust_bottle@92684e50/physical-intelligence/robotwin/norm_stats.json}
    openpi:
      config_name: pi0_aloha_robotwin
      num_images_in_input: 3
      action_horizon: 50
      action_chunk: ${actor.model.ref_num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: 4
      state_indices: []
      train_expert_only: false
      add_value_head: false
      detach_critic_input: true
      noise_method: flow_ode
      rtc_enabled: false
      use_rlt: true
      rlt_train_vla: false
      rlt_alpha: 0.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 768
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_image_only: true
      rlt_use_mask: true
      rlt_action_adapter: robotwin_aloha_canonical_v1
  enable_torch_compile: false
  enable_cuda_graph: false

actor:
  group_name: ActorGroup
  training_backend: fsdp
  # 512/128 is the upstream current ManiSkill RLT Stage2 batch and was retained
  # by the old RoboTwin runs; it remains a launch-overlay candidate here.
  micro_batch_size: 128
  global_batch_size: 512
  seed: 1234
  enable_offload: false
  model:
    model_type: rlt_mlp_policy
    precision: fp32
    z_dim: 2048
    proprio_dim: 14
    action_dim: 14
    num_action_chunks: 10
    ref_num_action_chunks: 10
    add_value_head: false
    add_q_head: true
    q_head_type: default
    fixed_std: 0.002
    is_lora: false
    lora_rank: 32
  optim:
    clip_grad: 10.0
    lr: 1.0e-4
    lr_scheduler: torch_constant
  critic_optim:
    clip_grad: 10.0
    lr: 1.0e-4
    lr_scheduler: torch_constant
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false

weight_syncer:
  patch:
    snapshot_device: cpu
    init_sync:
      enabled: true
